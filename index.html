<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="衛生管理者">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>第一種衛生管理者 問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow study column, sticky top bar with the green-cross mark and exam countdown, fixed bottom tab bar */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --ink:#15211a; --muted:#5a6a60; --line:#d9e2db;
  --accent:#0f7a46; --accent-ink:#ffffff; --accent-soft:#e2f2e8;
  --ok:#137a43; --ok-soft:#dff3e6; --ng:#c0392b; --ng-soft:#fbe5e1; --warn:#a86a00;
  --display:"Zen Kaku Gothic Antique","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --ink:#e6eee8; --muted:#97a69c; --line:#2a362f;
  --accent:#43c27f; --accent-ink:#0b1a12; --accent-soft:#1d3427;
  --ok:#4fd08b; --ok-soft:#173326; --ng:#ff7a68; --ng-soft:#3a1d19; --warn:#e8b24a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --ink:#e6eee8; --muted:#97a69c; --line:#2a362f;
  --accent:#43c27f; --accent-ink:#0b1a12; --accent-soft:#1d3427;
  --ok:#4fd08b; --ok-soft:#173326; --ng:#ff7a68; --ng-soft:#3a1d19; --warn:#e8b24a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.mark{width:28px;height:28px;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.count{margin-left:auto;text-align:right;line-height:1.1}
.count small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.count strong{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.count em{font-style:normal;font-size:12px;margin-left:2px}
.wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:900;font-size:20px;margin:8px 0 0;text-wrap:balance}
.lead{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.subj{display:flex;flex-direction:column;gap:10px}
.subj-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.subj-h h3{margin:0;font-size:17px;font-weight:700}
.tag{font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.stat{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-ng{background:var(--ng)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
details.fields summary{font-size:14px;color:var(--muted);cursor:pointer;list-style:none;padding:4px 0}
details.fields summary::before{content:"＋ ";color:var(--accent)}
details.fields[open] summary::before{content:"－ "}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip.done{border-color:var(--ok)}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px}
.qpos{font-family:var(--mono);font-size:14px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.qtext{white-space:pre-wrap;font-size:16.5px;font-weight:500;margin:0}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.6}
.ch .no{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;margin-top:1px}
.ch .tx{min-width:0}
.ch:not(:disabled):hover{border-color:var(--accent)}
.ch.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.is-ok .no{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ch.is-ng{border-color:var(--ng);background:var(--ng-soft)}
.ch.is-ng .no{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.ch:disabled{cursor:default}
.verdict{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:22px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.verdict .sym{font-size:30px;line-height:1}
.exp{border-left:4px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.exp .ans{font-weight:700}
.exp p{margin:0}
.navq{display:flex;gap:8px}
.navq .btn{flex:1}
/* result */
.score{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:18px;color:var(--muted)}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res th,table.res td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.res td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ng{background:var(--ng-soft);color:var(--ng)}
/* summary */
details.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sum>summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.sum>summary::after{content:"＋";color:var(--accent)}
details.sum[open]>summary::after{content:"－"}
.pt{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.pt div b{display:block;font-size:14px;color:var(--accent)}
.pt div p{margin:2px 0 0;font-size:14.5px}
.links a{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--accent);font-weight:700;text-decoration:none}
.links a span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;padding:10px 4px 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.ch,.btn{transition:border-color .15s,background .15s}}
</style>
</head>
<body>


<header class="top"><div class="top-in">
  <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="var(--accent)"/><path d="M11 5h6v6h6v6h-6v6h-6v-6H5v-6h6z" fill="var(--surface)"/></svg>
  <div class="brand"><b>第一種衛生管理者</b><span>分野別問題集・全<span id="totalN"></span>問</span></div>
  <div class="count"><small>12/8 試験まで</small><strong id="days">--</strong><em>日</em></div>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="メニュー"><div class="tabs-in">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>問題</button>
  <button class="tab" data-tab="mock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>模擬試験</button>
  <button class="tab" data-tab="sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>要点</button>
  <button class="tab" data-tab="links"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg>過去問</button>
</div></nav>

<script>
const DATA = [{"id": 1, "s": "労働衛生（有害業務）", "f": "化学物質の状態", "q": "化学物質とその常温・常圧（25℃、1気圧）での空気中における状態との組合せとして、誤っているものはどれか。", "c": ["硫酸ジメチル ― ガス", "アセトン ― 蒸気", "ジクロロベンジジン ― 粉じん", "塩化ビニル ― ガス", "塩素 ― ガス"], "a": 1, "e": "硫酸ジメチルは常温で液体のため「蒸気」。常温で気体＝ガス（塩素・塩化ビニル）、液体が揮発＝蒸気（アセトン）、固体を砕いた微粒子＝粉じん（ジクロロベンジジン）。"}, {"id": 2, "s": "労働衛生（有害業務）", "f": "化学物質の状態", "q": "化学物質とその常温・常圧での空気中における状態との組合せとして、正しいものはどれか。", "c": ["二硫化炭素 ― ガス", "アクリロニトリル ― 蒸気", "ホルムアルデヒド ― 蒸気", "溶接作業で発生する酸化亜鉛 ― 粉じん", "アンモニア ― 蒸気"], "a": 2, "e": "アクリロニトリルは常温で液体→蒸気。二硫化炭素は蒸気、ホルムアルデヒドとアンモニアはガス、金属が気化・凝固した微粒子はヒューム。"}, {"id": 3, "s": "労働衛生（有害業務）", "f": "化学物質の状態", "q": "空気中の有害物質の状態に関する次の記述のうち、誤っているものはどれか。", "c": ["ヒュームは、固体が加熱により溶解・気化し、空気中で凝固して生じた微細な固体粒子である。", "ミストは、液体の微細な粒子が空気中に浮遊しているものである。", "ガスは、常温・常圧で液体の物質が揮発して気体となったものである。", "粉じんは、固体に研磨、切削、粉砕等の機械的な作用を加えて発生した固体微粒子である。", "蒸気は、常温・常圧で液体又は固体の物質が、揮発又は昇華して気体となっているものである。"], "a": 3, "e": "ガスは常温・常圧で「気体」である物質。液体が揮発したものは「蒸気」。"}, {"id": 4, "s": "労働衛生（有害業務）", "f": "化学物質による健康障害", "q": "化学物質とそれによる健康障害との組合せとして、誤っているものはどれか。", "c": ["塩素 ― 咽頭痛、咳、胸苦しさなどを起こし、肺水腫を起こすことがある", "シアン化水素 ― 細胞内での酸素利用を阻害し、呼吸困難、けいれんなどを起こす", "二酸化窒素 ― 慢性中毒で、骨の硬化、斑状歯などがみられる", "硫化水素 ― 高濃度ばく露で、意識消失、呼吸麻痺を起こす", "一酸化炭素 ― ヘモグロビンと強く結合し、体内組織の酸素欠乏状態を起こす"], "a": 3, "e": "骨の硬化・斑状歯は弗化水素。二酸化窒素の慢性中毒は慢性気管支炎、歯牙酸蝕症など。"}, {"id": 5, "s": "労働衛生（有害業務）", "f": "化学物質による健康障害", "q": "一酸化炭素に関する次の記述のうち、誤っているものはどれか。", "c": ["一酸化炭素は無色・無臭の気体であるため、吸入しても気付かないことが多い。", "一酸化炭素中毒は、頭痛、めまいなどから始まり、意識混濁がみられ、濃度によっては死亡に至る。", "一酸化炭素とヘモグロビンの親和性は、酸素とヘモグロビンの親和性の200倍以上である。", "一酸化炭素中毒の後遺症として、健忘やパーキンソン症状がみられることはない。", "一酸化炭素は、エンジンの排気ガスやたばこの煙などに含まれる。"], "a": 4, "e": "一酸化炭素中毒では、回復後も健忘やパーキンソン症状などの後遺症が残ることがある。"}, {"id": 6, "s": "労働衛生（有害業務）", "f": "化学物質による健康障害", "q": "化学物質とそれによる慢性中毒の症状との組合せとして、正しいものはどれか。", "c": ["ベンゼン ― 再生不良性貧血、白血病", "塩化ビニル ― 皮膚の黒皮症", "ベンジジン ― 中皮腫", "二硫化炭素 ― 膀胱がん", "ノルマルヘキサン ― 視神経障害"], "a": 1, "e": "ノルマルヘキサン＝末梢神経障害、二硫化炭素＝精神障害・網膜細小動脈瘤、塩化ビニル＝肝血管肉腫、ベンジジン＝膀胱がん。視神経障害はメタノール。"}, {"id": 7, "s": "労働衛生（有害業務）", "f": "化学物質による健康障害", "q": "化学物質と、それにより発症するおそれのある主な職業がんとの組合せとして、誤っているものはどれか。", "c": ["ベータ-ナフチルアミン ― 膀胱がん", "コールタール ― 皮膚がん", "塩化ビニル ― 肝血管肉腫", "ベンゼン ― 胃がん", "石綿 ― 肺がん、中皮腫"], "a": 4, "e": "ベンゼンによる職業がんは白血病。"}, {"id": 8, "s": "労働衛生（有害業務）", "f": "化学物質による健康障害", "q": "次のAからDの化学物質と健康障害の組合せのうち、正しいものの組合せはどれか。\nA 弗化水素 ― 骨の硬化、斑状歯\nB メタノール ― 視神経障害\nC 二酸化硫黄 ― 再生不良性貧血\nD 硫化水素 ― 膀胱がん", "c": ["A, B", "A, C", "A, D", "B, C", "C, D"], "a": 1, "e": "二酸化硫黄は慢性気管支炎・歯牙酸蝕症、硫化水素は意識消失・呼吸麻痺。再生不良性貧血はベンゼン、膀胱がんはベンジジン等。"}, {"id": 9, "s": "労働衛生（有害業務）", "f": "有機溶剤", "q": "有機溶剤に関する次の記述のうち、誤っているものはどれか。", "c": ["有機溶剤の多くは、中枢神経系に対して麻酔作用を有する。", "有機溶剤は、脂溶性が高く、皮膚や呼吸器から吸収されやすい。", "低濃度の有機溶剤の繰り返しばく露では、頭痛、めまい、物忘れ、不眠などの不定愁訴がみられることがある。", "有機溶剤は水溶性であるため、皮膚から吸収されることはほとんどない。", "有機溶剤は、揮発性が高く、その蒸気は空気より重い。"], "a": 4, "e": "有機溶剤は脂溶性で、皮膚からも吸収される。"}, {"id": 10, "s": "労働衛生（有害業務）", "f": "有機溶剤", "q": "有機溶剤とそれによる特有の健康障害との組合せとして、誤っているものはどれか。", "c": ["トルエン ― 再生不良性貧血、白血病", "N,N-ジメチルホルムアミド ― 肝機能障害", "ノルマルヘキサン ― 末梢神経障害（多発性神経炎）", "メタノール ― 視神経障害", "二硫化炭素 ― 精神障害、網膜細小動脈瘤"], "a": 1, "e": "再生不良性貧血・白血病はベンゼン。"}, {"id": 11, "s": "労働衛生（有害業務）", "f": "有機溶剤", "q": "有機溶剤とその尿中代謝物との組合せとして、誤っているものはどれか。", "c": ["N,N-ジメチルホルムアミド ― デルタアミノレブリン酸", "トルエン ― 馬尿酸", "キシレン ― メチル馬尿酸", "ノルマルヘキサン ― 2,5-ヘキサンジオン", "スチレン ― マンデル酸"], "a": 1, "e": "N,N-ジメチルホルムアミドの尿中代謝物はN-メチルホルムアミド。デルタアミノレブリン酸は鉛の健診項目。"}, {"id": 12, "s": "労働衛生（有害業務）", "f": "有機溶剤", "q": "有機溶剤に関する次の記述のうち、正しいものはどれか。", "c": ["有機溶剤による障害は高濃度ばく露による急性中毒のみで、慢性中毒は起こらない。", "尿中代謝物の測定は、有機溶剤へのばく露の程度の指標とはならない。", "第1種有機溶剤等の区分表示は青色である。", "有機溶剤の蒸気は空気より軽いため、天井付近に滞留しやすい。", "第2種有機溶剤等の区分表示は黄色である。"], "a": 5, "e": "区分表示は第1種＝赤、第2種＝黄、第3種＝青。蒸気は空気より重く床付近に滞留する。尿中代謝物はばく露の指標（生物学的モニタリング）。"}, {"id": 13, "s": "労働衛生（有害業務）", "f": "金属", "q": "金属による健康障害に関する次の記述のうち、誤っているものはどれか。", "c": ["マンガン中毒では、筋のこわばり、震え、歩行困難などのパーキンソン病に似た症状がみられる。", "クロム中毒では、低分子蛋白尿、歯への黄色の色素沈着、視野狭窄などがみられる。", "カドミウム中毒では、上気道炎、肺炎、腎機能障害などがみられる。", "鉛中毒では、貧血、伸筋麻痺、腹部の疝痛などがみられる。", "金属水銀中毒では、感情不安定、幻覚などの精神障害や手指の震えなどがみられる。"], "a": 2, "e": "クロムの代表的な障害は肺がん、上気道がん、鼻中隔穿孔、皮膚潰瘍など。"}, {"id": 14, "s": "労働衛生（有害業務）", "f": "金属", "q": "金属による健康障害に関する次の記述のうち、正しいものはどれか。", "c": ["ベリリウム中毒では、溶血性貧血、尿の赤色化などがみられる。", "ヒ素中毒では、角化症、黒皮症などの皮膚障害や鼻中隔穿孔などがみられる。", "鉛健康診断では、尿中のマンデル酸の量を測定する。", "金属熱は、ばく露直後に高熱が出て数週間持続する。", "クロムによる健康障害の特徴は、中枢神経の麻酔作用である。"], "a": 2, "e": "ベリリウム＝接触皮膚炎・肺炎・慢性肺疾患。鉛健診は血中鉛と尿中デルタアミノレブリン酸。金属熱は亜鉛・銅などのヒューム吸入の数時間後に悪寒・発熱し、1〜2日で治まる。"}, {"id": 15, "s": "労働衛生（有害業務）", "f": "金属", "q": "次のAからDの金属と健康障害の組合せのうち、正しいものの組合せはどれか。\nA 鉛 ― 貧血、伸筋麻痺\nB マンガン ― 指の骨の溶解、肝臓の血管肉腫\nC カドミウム ― 肺気腫、腎機能障害\nD 金属水銀 ― 再生不良性貧血", "c": ["A, B", "A, C", "B, C", "B, D", "C, D"], "a": 2, "e": "指の骨の溶解・肝血管肉腫は塩化ビニル。再生不良性貧血はベンゼン。マンガンはパーキンソン様症状、金属水銀は精神障害・手指振戦。"}, {"id": 16, "s": "労働衛生（有害業務）", "f": "じん肺", "q": "じん肺に関する次の記述のうち、誤っているものはどれか。", "c": ["じん肺は、粉じんへのばく露を中止した後も症状が進行することがある。", "じん肺の合併症には、肺結核、続発性気管支炎、続発性気胸、原発性肺がんなどがある。", "じん肺は、治療により肺の線維化を元に戻すことができる可逆的な疾病である。", "じん肺は、粉じんを吸入することによって肺に生じた線維増殖性変化を主体とする疾病である。", "じん肺の初期には自覚症状がほとんどなく、進行すると咳、痰、呼吸困難などがみられる。"], "a": 3, "e": "じん肺の線維化は不可逆。有効な治療法はない。"}, {"id": 17, "s": "労働衛生（有害業務）", "f": "じん肺", "q": "じん肺に関する次の記述のうち、正しいものはどれか。", "c": ["じん肺の合併症に、原発性肺がんは含まれない。", "アルミニウムやその化合物によるじん肺は発生しない。", "けい肺は、鉄やアルミニウムなどの金属粉じんによるじん肺で、遊離けい酸は原因とならない。", "じん肺有所見者は、続発性気管支拡張症にかかりにくい。", "石綿粉じんは、石綿肺のほか、肺がんや胸膜・腹膜の中皮腫の原因となる。"], "a": 5, "e": "けい肺は遊離けい酸（石英など）が原因。アルミニウム肺も存在する。原発性肺がん・続発性気管支拡張症はじん肺の合併症。"}, {"id": 18, "s": "労働衛生（有害業務）", "f": "騒音", "q": "騒音による健康障害に関する次の記述のうち、誤っているものはどれか。", "c": ["騒音は自律神経系や内分泌系にも影響を与え、交感神経の活動の亢進などが認められることがある。", "騒音性難聴は、低い周波数の音から聴力が低下するため、日常会話への支障に早期に気付きやすい。", "騒音性難聴の初期には、4,000Hz付近の音から聴力が低下する（c5dip）。", "騒音性難聴は、初期には気付かないことが多く、また、治りにくいという特徴がある。", "騒音性難聴は、内耳の有毛細胞の変性によって起こる感音性難聴である。"], "a": 2, "e": "騒音性難聴は高音域（4,000Hz付近）から低下するため、初期は会話音域に影響が少なく気付きにくい。"}, {"id": 19, "s": "労働衛生（有害業務）", "f": "騒音", "q": "騒音に関する次の記述のうち、正しいものはどれか。", "c": ["耳覆い（イヤーマフ）と耳栓は、併用してはならない。", "人が感じる騒音の大きさは、音圧レベルが同じであれば周波数によらず同じである。", "等価騒音レベルは、変動する騒音レベルを一定時間内の平均的なエネルギー量で表したもので、dB(A)で表示される。", "騒音性難聴は、騒音ばく露を中止すれば聴力は完全に回復する。", "騒音レベルの測定値が85dB(A)未満であっても、聴覚保護具の使用が義務付けられている。"], "a": 3, "e": "騒音障害防止ガイドラインでは85dB(A)未満は第1管理区分。耳栓と耳覆いは併用可。人の聴覚は周波数で感度が異なるためA特性で補正する。騒音性難聴は治りにくい。"}, {"id": 20, "s": "労働衛生（有害業務）", "f": "振動", "q": "振動障害に関する次の記述のうち、誤っているものはどれか。", "c": ["局所振動障害には、レイノー現象などの末梢循環障害、手指のしびれなどの末梢神経障害、運動機能障害がある。", "局所振動障害によるレイノー現象は夏季に多く、寒冷により症状は軽快する。", "全身振動障害では、腰痛や胃腸障害などがみられることがある。", "レイノー現象（白指発作）は、冬期に発生しやすい。", "振動工具を取り扱う作業では、防振手袋を着用させる。"], "a": 2, "e": "レイノー現象は寒冷で誘発され、冬期に多い。"}, {"id": 21, "s": "労働衛生（有害業務）", "f": "電離放射線", "q": "電離放射線による健康影響に関する次の記述のうち、誤っているものはどれか。", "c": ["造血器、生殖腺、腸粘膜は、放射線に対する感受性が低い組織である。", "白内障や皮膚障害は確定的影響に、がんや遺伝的影響は確率的影響に分類される。", "確定的影響には、しきい線量が存在し、被ばく線量が増すと障害の重篤度が増す。", "電離放射線の被ばくによる影響には、身体的影響と遺伝的影響がある。", "確率的影響は、しきい線量がなく、被ばく線量が増すと発生確率が増す。"], "a": 1, "e": "造血器、生殖腺、腸粘膜、皮膚など細胞分裂の盛んな組織は放射線感受性が高い。"}, {"id": 22, "s": "労働衛生（有害業務）", "f": "電離放射線", "q": "電離放射線に関する次の記述のうち、正しいものはどれか。", "c": ["電離放射線による中枢神経系の障害は、確率的影響に分類される。", "被ばく後数週間以内に現れる急性障害は、確率的影響に分類される。", "晩発障害には、白内障やがんなどがある。", "等価線量の単位はグレイ（Gy）である。", "エックス線は、電離放射線ではない。"], "a": 3, "e": "中枢神経障害・急性障害は確定的影響。エックス線は電離放射線。等価線量・実効線量の単位はシーベルト（Sv）、吸収線量はグレイ（Gy）。"}, {"id": 23, "s": "労働衛生（有害業務）", "f": "温熱（熱中症）", "q": "熱中症に関する次の記述のうち、誤っているものはどれか。", "c": ["熱けいれんは、大量の発汗の後に水分だけを補給したため、血液中の塩分濃度が低下して起こる。", "熱失神は、皮膚血管の拡張による血圧低下で脳への血流が減少し、めまいや失神を起こすものである。", "熱疲労は、脱水により全身倦怠感、頭痛、吐き気などがみられるものである。", "熱射病は、体温調節中枢の機能が障害され、意識障害や高体温を生じるもので、死亡することもある。", "熱けいれんの予防には、塩分を含まない水を大量に摂取することが最も効果的である。"], "a": 5, "e": "熱けいれんは塩分不足が原因。水分と同時に塩分を補給する。"}, {"id": 24, "s": "労働衛生（有害業務）", "f": "温熱（熱中症）", "q": "WBGT（暑さ指数）に関する次の記述のうち、正しいものはどれか。", "c": ["日射がある場合のWBGTは、0.7×自然湿球温度＋0.3×乾球温度で求める。", "WBGT基準値は、身体作業強度が高いほど高い値に設定されている。", "日射がない場合のWBGTは、0.7×自然湿球温度＋0.3×黒球温度で求める。", "WBGT基準値は、熱に順化した人のほうが順化していない人より低い値に設定されている。", "WBGTは、気温、湿度、気流の3要素から求める指数であり、ふく射熱は考慮しない。"], "a": 3, "e": "日射ありは0.7×自然湿球＋0.2×黒球＋0.1×乾球。作業強度が高いほど基準値は低く、熱順化者のほうが基準値は高い。黒球温度でふく射熱を考慮する。"}, {"id": 25, "s": "労働衛生（有害業務）", "f": "寒冷・減圧・酸欠", "q": "有害因子による健康障害に関する次の記述のうち、誤っているものはどれか。", "c": ["減圧症は、潜函作業者や潜水作業者が高圧下に移行する加圧時に発生する。", "減圧症は、減圧時に血液中に溶け込んでいた窒素が気泡となり、血液循環を阻害したり組織を圧迫したりして起こる。", "低体温症は、体の中心部の温度が35℃程度以下に低下した状態をいう。", "空気中の酸素濃度が18%未満の状態を酸素欠乏という。", "凍傷は0℃以下の寒冷による組織の凍結壊死であり、凍瘡（しもやけ）は日常的な軽度の寒冷で生じる。"], "a": 1, "e": "減圧症は高圧下から常圧に戻る「減圧時」に発生する。"}, {"id": 26, "s": "労働衛生（有害業務）", "f": "非電離放射線", "q": "非電離放射線等による健康障害に関する次の記述のうち、誤っているものはどれか。", "c": ["赤外線は、白内障を起こすことがある。", "レーザー光線は、強い指向性や集束性を有し、網膜損傷などを起こすことがある。", "赤外線は、電離作用を有する電離放射線に分類される。", "紫外線は、電光性眼炎（角膜・結膜の炎症）や皮膚がんの原因となる。", "マイクロ波は、照射部位の組織を加熱する作用がある。"], "a": 3, "e": "赤外線は非電離放射線。電離放射線はエックス線、ガンマ線、アルファ線、ベータ線、中性子線など。"}, {"id": 27, "s": "労働衛生（有害業務）", "f": "作業環境測定", "q": "作業環境測定（A測定のみ実施）の評価に関する次の記述のうち、正しいものはどれか。", "c": ["管理濃度は、個々の労働者の有害物質へのばく露限界として設定されたものである。", "B測定は、単位作業場所全体の平均的な濃度分布を知るために行う。", "第二評価値が管理濃度を超える単位作業場所は、第2管理区分となる。", "第一評価値が管理濃度未満の単位作業場所は、第1管理区分となる。", "第一評価値は、単位作業場所における気中有害物質の算術平均濃度の推定値である。"], "a": 4, "e": "第二評価値＞管理濃度は第3管理区分。第一評価値は高濃度側から5%に相当する濃度の推定値で、算術平均の推定値は第二評価値。管理濃度は作業環境管理の良否を判断する指標。平均的な分布を知るのはA測定。"}, {"id": 28, "s": "労働衛生（有害業務）", "f": "作業環境測定", "q": "作業環境測定及びその評価に関する次の記述のうち、誤っているものはどれか。", "c": ["第二評価値が管理濃度以下で、第一評価値が管理濃度を超える場合は、第1管理区分となる。", "第3管理区分の場合は、直ちに施設、設備、作業工程又は作業方法の点検を行い、改善措置を講じなければならない。", "B測定は、発散源に近接する場所で作業が行われる場合に、高濃度ばく露の危険性を評価するために行う。", "A測定の第一評価値が管理濃度未満であっても、B測定値が管理濃度の1.5倍を超える場合は第3管理区分となる。", "A測定は、単位作業場所における有害物質の気中濃度の平均的な分布を知るために行う。"], "a": 1, "e": "第二評価値≦管理濃度≦第一評価値は第2管理区分。"}, {"id": 29, "s": "労働衛生（有害業務）", "f": "局所排気装置", "q": "局所排気装置に関する次の記述のうち、誤っているものはどれか。", "c": ["主ダクトと枝ダクトの合流角度は、45°を超えないようにする。", "ダクトの断面積を大きくするほど、ダクトの圧力損失は減少する。", "ダクトが細すぎると圧力損失が増大し、太すぎると搬送速度が不足する。", "ダクトの曲がり部分はなるべく少なくし、曲がりの半径を大きくする。", "空気清浄装置を付設する局所排気装置では、排風機は空気清浄装置の前（上流側）に設ける。"], "a": 5, "e": "排風機（ファン）は空気清浄装置の後（清浄後の空気が通る位置）に設ける。"}, {"id": 30, "s": "労働衛生（有害業務）", "f": "局所排気装置", "q": "局所排気装置のフードに関する次の記述のうち、正しいものはどれか。", "c": ["ドラフトチェンバ型フードは、外付け式フードに分類される。", "スロット型フードは、レシーバ式フードに分類される。", "外付け式フードは、囲い式フードより少ない排風量で効果的に有害物を排出できる。", "フード開口部の周囲にフランジを取り付けると、少ない排風量で所要の効果を上げることができる。", "キャノピ型フードは、外付け式フードに分類される。"], "a": 4, "e": "囲い式が最も効果的。キャノピ型＝レシーバ式、ドラフトチェンバ型＝囲い式、スロット型＝外付け式。"}, {"id": 31, "s": "労働衛生（有害業務）", "f": "局所排気装置", "q": "局所排気装置に関する次の記述のうち、誤っているものはどれか。", "c": ["囲い式フードの制御風速は、フード開口面における最小風速をいう。", "囲い式フードでは、開口面を大きくするほど排除効果が高まる。", "空気清浄装置付きの局所排気装置は、フード、ダクト、空気清浄装置、排風機、排気口の順に構成される。", "外付け式フードの制御風速は、フード開口面から最も離れた作業位置の風速をいう。", "有害物を排出する局所排気装置の排気口は、原則として屋外に設ける。"], "a": 2, "e": "囲い式フードは開口面をできるだけ小さくしたほうが、少ない排風量で効果が上がる。"}, {"id": 32, "s": "労働衛生（有害業務）", "f": "保護具", "q": "防じんマスクに関する次の記述のうち、誤っているものはどれか。", "c": ["使い捨て式防じんマスクは、再使用しない。", "ろ過材の目詰まりにより吸気抵抗が上昇した場合は、ろ過材を交換する。", "防じんマスクは、酸素濃度18%未満の場所では使用してはならない。", "面体と顔の間にタオル等を当てて着用すると、粉じんが漏れ込むおそれがあるので行わない。", "ろ過材に付着した粉じんは、圧縮空気で吹き飛ばして除去する。"], "a": 5, "e": "圧縮空気で吹き飛ばしたり、強くたたいたりすると、ろ過材を傷めたり粉じんが飛散したりするので行わない。"}, {"id": 33, "s": "労働衛生（有害業務）", "f": "保護具", "q": "防毒マスクの吸収缶の種類と外部側面の色との組合せとして、誤っているものはどれか。", "c": ["有機ガス用 ― 黒", "硫化水素用 ― 黄", "アンモニア用 ― 緑", "シアン化水素用 ― 灰", "一酸化炭素用 ― 赤"], "a": 4, "e": "シアン化水素用は青。ハロゲンガス用は灰/黒、亜硫酸ガス用は黄赤。"}, {"id": 34, "s": "労働衛生（有害業務）", "f": "保護具", "q": "呼吸用保護具等に関する次の記述のうち、正しいものはどれか。", "c": ["2種類以上の有毒ガスが混在する場合は、最も毒性の強いガスに対応する吸収缶を使用すれば足りる。", "防毒マスクは、酸素濃度18%未満の場所でも、有毒ガスの濃度が低ければ使用できる。", "防音保護具として、耳栓と耳覆いを併用してはならない。", "送気マスクや空気呼吸器（自給式呼吸器）は、酸素欠乏の場所でも使用できる。", "防毒マスクの吸収缶は、臭いを感じない限り、使用時間にかかわらず交換の必要はない。"], "a": 4, "e": "ろ過式（防じん・防毒）は酸欠場所では使用不可。混在ガスはすべてに有効な吸収缶か送気マスク等を使う。吸収缶は破過時間を考慮して交換する。"}, {"id": 35, "s": "労働衛生（有害業務）", "f": "特殊健康診断", "q": "有害業務と特殊健康診断の検査項目との組合せとして、誤っているものはどれか。", "c": ["電離放射線 ― 白血球数及び白血球百分率の検査", "鉛 ― 血液中の鉛の量、尿中のデルタアミノレブリン酸の量", "N,N-ジメチルホルムアミド ― 尿中のマンデル酸の量", "スチレン ― 尿中のマンデル酸及びフェニルグリオキシル酸の総量", "ノルマルヘキサン ― 尿中の2,5-ヘキサンジオンの量"], "a": 3, "e": "N,N-ジメチルホルムアミドは尿中のN-メチルホルムアミドの量。マンデル酸はスチレン。"}, {"id": 36, "s": "労働衛生（有害業務）", "f": "特殊健康診断", "q": "有害業務とそれに関連する健康診断の検査項目との組合せとして、正しいものはどれか。", "c": ["騒音業務 ― 1,000Hz及び4,000Hzにおける選別聴力検査", "電離放射線業務 ― 尿中の馬尿酸の量", "石綿業務 ― 血液中の鉛の量", "振動工具の取扱い業務 ― 尿中の総三塩化物の量", "高気圧業務 ― 尿中のデルタアミノレブリン酸の量"], "a": 1, "e": "騒音健診の定期検査はオージオメータによる1,000Hz・4,000Hzの選別聴力検査。総三塩化物はトリクロロエチレン等、デルタアミノレブリン酸は鉛。"}, {"id": 37, "s": "労働衛生（有害業務）", "f": "労働衛生管理", "q": "次の労働衛生対策のうち、作業環境管理に該当するものはどれか。", "c": ["振動工具の取扱い作業者に防振手袋を使用させる。", "有機溶剤業務を行う作業場所に局所排気装置を設置する。", "暑熱作業の作業時間を短縮する。", "鉛業務従事者に特殊健康診断を実施する。", "粉じん作業者に防じんマスクを着用させる。"], "a": 2, "e": "作業環境管理＝有害物の除去・低減（局排、代替、密閉化、作業環境測定）。保護具・作業時間・作業姿勢は作業管理、健康診断は健康管理。"}, {"id": 38, "s": "労働衛生（有害業務）", "f": "労働衛生管理", "q": "労働衛生対策とその管理区分の組合せとして、誤っているものはどれか。", "c": ["作業環境測定の結果に基づき、局所排気装置を増設する ― 作業環境管理", "腰痛予防のため作業姿勢を改善する ― 作業管理", "情報機器作業で、一連続作業時間を短くし作業休止時間を設ける ― 作業管理", "鉛業務従事者の血液中の鉛の量を測定する ― 作業環境管理", "有害物質を有害性の低い物質に代替する ― 作業環境管理"], "a": 4, "e": "労働者の血中鉛の測定は健康診断の一部であり、健康管理に該当する。"}, {"id": 39, "s": "労働衛生（有害業務）", "f": "リスクアセスメント", "q": "化学物質のリスクアセスメントの結果に基づくリスク低減措置のうち、法令に定める措置以外で、優先度が最も高いものはどれか。", "c": ["有効な呼吸用保護具の使用", "作業手順の改善", "立入禁止措置", "危険性又は有害性のより低い物質への代替", "局所排気装置の設置"], "a": 4, "e": "優先順位：①代替・工程変更などの本質的対策 → ②局排など工学的対策 → ③作業手順改善・立入禁止など管理的対策 → ④保護具。"}, {"id": 40, "s": "労働衛生（有害業務）", "f": "リスクアセスメント", "q": "化学物質のリスクアセスメントに関する次の記述のうち、誤っているものはどれか。", "c": ["リスクの見積もりには、実測値や推定値によるばく露濃度とばく露限界を比較する方法がある。", "リスクアセスメント対象物を新規に採用する時や、作業方法・手順を新規に採用・変更する時などに実施する。", "リスクの見積もりには、危険性又は有害性による負傷・疾病の発生の可能性と重篤度を考慮する方法がある。", "リスクアセスメントの結果は、労働者に周知しなければならない。", "リスク低減措置として、有効な保護具の使用は他の措置よりも優先して実施すべきである。"], "a": 5, "e": "保護具の使用は優先順位が最も低く、他の措置で十分にリスクを下げられない場合に用いる。"}, {"id": 41, "s": "労働衛生（有害業務以外）", "f": "必要換気量", "q": "在室者が15人の事務室において、二酸化炭素濃度を1,000ppm以下に保つために必要な最小の換気量（m³/h）に最も近いものは次のうちどれか。ただし、在室者が呼出する二酸化炭素量は1人当たり0.018m³/h、外気の二酸化炭素濃度は400ppmとする。", "c": ["270", "450", "675", "900", "4,500"], "a": 2, "e": "必要換気量＝(0.018×15)÷(0.001−0.0004)＝0.27÷0.0006＝450m³/h。ppmは10⁻⁶なので、1,000ppm＝0.001、400ppm＝0.0004。"}, {"id": 42, "s": "労働衛生（有害業務以外）", "f": "必要換気量", "q": "必要換気量等に関する次の記述のうち、誤っているものはどれか。", "c": ["必要換気量は、在室者が1時間に呼出する二酸化炭素量を、室内二酸化炭素基準濃度と外気の二酸化炭素濃度の差で除して求める。", "必要換気量の算出に用いる室内の二酸化炭素基準濃度は、通常0.1%とする。", "必要換気量が同じであれば、気積が大きい部屋ほど、必要な換気回数は多くなる。", "必要換気量は、通常、室内の二酸化炭素濃度を基準として算出する。", "人の呼気中の二酸化炭素濃度は約4%、酸素濃度は約16%である。"], "a": 3, "e": "必要換気回数＝必要換気量÷気積。気積が大きいほど換気回数は少なくて済む。"}, {"id": 43, "s": "労働衛生（有害業務以外）", "f": "温熱条件", "q": "温熱条件に関する次の記述のうち、誤っているものはどれか。", "c": ["至適温度は、作業強度や作業時間、個人差に関係なく一定の値である。", "実効温度は、気温、湿度及び気流の総合効果を温度目盛りで表したもので、感覚温度ともいわれる。", "修正実効温度は、実効温度にふく射熱の影響を加えたものである。", "温度感覚を左右する環境条件は、気温、湿度、気流及びふく射（放射）熱の4つの要素である。", "相対湿度は、空気中の水蒸気量と、その温度における飽和水蒸気量との比を百分率で示したものである。"], "a": 1, "e": "至適温度は作業強度、季節、性別、年齢、個人差などで異なる。作業強度が大きいほど低くなる。"}, {"id": 44, "s": "労働衛生（有害業務以外）", "f": "温熱条件", "q": "温熱条件の測定等に関する次の記述のうち、正しいものはどれか。", "c": ["作業強度が大きいほど、至適温度は低くなる。", "乾球温度と湿球温度の差が大きいほど、相対湿度は高い。", "ふく射熱の測定には、乾球温度計を用いる。", "気流の測定には、アスマン通風乾湿計を用いる。", "WBGT値が高いほど、熱中症のリスクは低い。"], "a": 1, "e": "乾湿差が大きいほど空気は乾燥（相対湿度は低い）。ふく射熱は黒球温度計、気流はカタ温度計や熱線風速計、アスマン通風乾湿計は気温・湿度の測定に用いる。"}, {"id": 45, "s": "労働衛生（有害業務以外）", "f": "照明", "q": "照明等に関する次の記述のうち、誤っているものはどれか。", "c": ["1ルクスは、光度1カンデラの光源から10m離れた所で、その光に直角な面が受ける明るさをいう。", "全般照明と局部照明を併用する場合、全般照明の照度は局部照明による照度の10分の1以上になるようにする。", "照明設備は、6か月以内ごとに1回、定期に点検する。", "部屋の彩色として、目の高さ以下は濁色にし、目より上方の壁や天井は明るい色にするとよい。", "前方から明かりを取るときは、眼と光源を結ぶ線と視線とが作る角度を30°以上になるようにする。"], "a": 1, "e": "1ルクスは、1カンデラの光源から「1m」離れた所で光に直角な面が受ける明るさ。"}, {"id": 46, "s": "労働衛生（有害業務以外）", "f": "照明", "q": "事務所における照明に関する次の記述のうち、正しいものはどれか。", "c": ["付随的な事務作業を行う作業面の照度は、70ルクス以上とすればよい。", "間接照明は、直接照明よりもまぶしさが強い。", "局部照明だけに頼ると照度の均一性が高まり、疲労しにくくなる。", "光源からの光が直接目に入るグレアは、作業能率に影響しない。", "一般的な事務作業を行う作業面の照度は、300ルクス以上としなければならない。"], "a": 5, "e": "2022年12月施行の事務所衛生基準規則改正で、一般的な事務作業は300ルクス以上、付随的な事務作業は150ルクス以上に変更された。"}, {"id": 47, "s": "労働衛生（有害業務以外）", "f": "情報機器作業", "q": "情報機器作業における労働衛生管理のためのガイドラインに関する次の記述のうち、誤っているものはどれか。", "c": ["ディスプレイは、おおむね40cm以上の視距離が確保できるようにする。", "情報機器作業に係る定期健康診断は、3年以内ごとに1回実施する。", "書類上及びキーボード上の照度は、300ルクス以上を目安とする。", "一連続作業時間が1時間を超えないようにし、次の連続作業までの間に10〜15分の作業休止時間を設ける。", "ディスプレイの画面の上端は、眼の高さとほぼ同じか、やや下になるようにする。"], "a": 2, "e": "定期健康診断は1年以内ごとに1回。配置前にも実施する。"}, {"id": 48, "s": "労働衛生（有害業務以外）", "f": "情報機器作業", "q": "情報機器作業に関する次の記述のうち、正しいものはどれか。", "c": ["ディスプレイは、画面に外光等が映り込むほうが見やすい。", "グレア防止のため、ディスプレイは窓に正対させて配置する。", "情報機器作業に新たに従事する労働者に対して、配置前の健康診断は不要である。", "椅子は、座面の高さを調整できないものが望ましい。", "一連続作業時間内において、1〜2回程度の小休止を設けるよう指導する。"], "a": 5, "e": "映り込みはグレアの原因。椅子は高さ調整可能なものが望ましい。配置前健診も実施する。窓に正対・背にする配置はグレアの原因となる。"}, {"id": 49, "s": "労働衛生（有害業務以外）", "f": "受動喫煙", "q": "職場における受動喫煙防止のためのガイドラインにおける喫煙専用室に関する次の記述のうち、誤っているものはどれか。", "c": ["喫煙専用室は喫煙のための専用室であり、飲食等はできない。", "たばこの煙が屋外又は外部の場所に排気されていること。", "たばこの煙が室内から室外に流出しないよう、壁、天井等によって区画されていること。", "空気清浄機を設置すれば、喫煙専用室の煙を屋外に排気しなくてもよい。", "出入口において、室外から室内に流入する空気の気流が0.2m/秒以上であること。"], "a": 4, "e": "空気清浄機ではガス状成分を除去できないため、屋外排気が必要。"}, {"id": 50, "s": "労働衛生（有害業務以外）", "f": "腰痛予防", "q": "職場における腰痛予防対策指針に関する次の記述のうち、誤っているものはどれか。", "c": ["腰部保護ベルトは、全員に一律に使用させるのではなく、個人ごとに効果を確認して使用の適否を判断する。", "重量物取扱い作業に常時従事する労働者には、配置前及びその後6か月以内ごとに1回、腰痛の健康診断を行う。", "満18歳以上の男性労働者が人力のみで取り扱う物の重量は、体重のおおむね40%以下となるよう努める。", "満18歳以上の女性労働者が人力のみで取り扱う物の重量は、男性が取り扱うことのできる重量の60%位までとする。", "重量物を持ち上げるときは、膝を伸ばしたまま腰を曲げて持ち上げる。"], "a": 5, "e": "重量物は、できるだけ身体を近づけ、膝を曲げて腰を落とした姿勢から持ち上げる。"}, {"id": 51, "s": "労働衛生（有害業務以外）", "f": "腰痛予防", "q": "職場における腰痛予防対策に関する次の記述のうち、正しいものはどれか。", "c": ["腰痛予防体操は作業開始前のみに行い、作業中や作業終了後には行わない。", "腰痛の健康診断は、配置前のみ実施すればよい。", "腰痛の配置前健康診断で、医師が必要と認める者については、画像診断と運動機能テスト等を行う。", "椅子に座って作業する場合は、足裏全体が床に接しない程度に座面を高くする。", "立ち作業では、床面が硬い場合でも、クッション性のある靴やマットの使用は避ける。"], "a": 3, "e": "床が硬い場合はクッション性のある靴やマットを使う。座面は足裏全体が床に接する高さに調整する。健診は配置前と6か月以内ごとに1回。"}, {"id": 52, "s": "労働衛生（有害業務以外）", "f": "メンタルヘルス", "q": "労働者の心の健康の保持増進のための指針に関する次の記述のうち、誤っているものはどれか。", "c": ["セルフケア、ラインによるケア、事業場内産業保健スタッフ等によるケア、事業場外資源によるケアの4つのケアを継続的かつ計画的に行う。", "心の健康については客観的な測定方法が確立しているため、管理監督者は部下の健康情報を本人の同意なく収集・利用してよい。", "ラインによるケアは、管理監督者が職場環境等の把握と改善や、労働者からの相談対応を行うものである。", "心の健康づくり計画の策定は、衛生委員会等において十分調査審議を行う。", "メンタルヘルスケアは、一次予防、二次予防及び三次予防が円滑に行われるようにする。"], "a": 2, "e": "心の健康は客観的な測定方法が十分確立しておらず、個人情報の保護と本人の意思の尊重に留意する必要がある。"}, {"id": 53, "s": "労働衛生（有害業務以外）", "f": "メンタルヘルス", "q": "メンタルヘルス指針の4つのケアのうち、「事業場外資源によるケア」に該当するものはどれか。", "c": ["労働者自身がストレスに気付き、対処する。", "管理監督者が部下からの相談に応じる。", "産業医や衛生管理者が、労働者や管理監督者を支援する。", "地域産業保健センターや医療機関などの専門機関を活用する。", "人事労務管理スタッフが、職場復帰支援を行う。"], "a": 4, "e": "1＝セルフケア、2＝ラインによるケア、3と5＝事業場内産業保健スタッフ等によるケア。"}, {"id": 54, "s": "労働衛生（有害業務以外）", "f": "一次救命処置", "q": "一次救命処置に関する次の記述のうち、誤っているものはどれか。", "c": ["人工呼吸を行う技術と意思がある場合は、胸骨圧迫30回と人工呼吸2回を繰り返す。", "しゃくりあげるような途切れ途切れの呼吸（死戦期呼吸）がみられる場合は、普段どおりの呼吸があるものとして経過を観察する。", "傷病者に反応がない場合は、大声で周囲の注意を喚起し、協力者に119番通報とAEDの手配を依頼する。", "胸骨圧迫は、胸が約5cm沈む強さで、1分間に100〜120回のテンポで行う。", "普段どおりの呼吸をしているかどうかの確認には、10秒以上かけないようにする。"], "a": 2, "e": "死戦期呼吸は「普段どおりの呼吸」ではない。心停止と判断して直ちに胸骨圧迫を開始する。"}, {"id": 55, "s": "労働衛生（有害業務以外）", "f": "一次救命処置", "q": "AEDを用いた一次救命処置に関する次の記述のうち、正しいものはどれか。", "c": ["胸骨圧迫の深さは、10cm程度とする。", "心電図の自動解析で「ショックは不要」と音声メッセージが流れたら、胸骨圧迫も中止する。", "気道確保は、首の後ろを持ち上げて頭部を前屈させて行う。", "電気ショックを行った後は、直ちに胸骨圧迫を再開する。", "人工呼吸は、1回3秒以上かけて大量に吹き込む。"], "a": 4, "e": "ショック不要でも直ちに胸骨圧迫を再開する。気道確保は頭部後屈あご先挙上法。人工呼吸は約1秒かけて胸が上がる程度。圧迫の深さは約5cm（6cmを超えない）。"}, {"id": 56, "s": "労働衛生（有害業務以外）", "f": "一次救命処置", "q": "一次救命処置に関する次の記述のうち、誤っているものはどれか。", "c": ["胸骨圧迫は、胸骨の下半分を圧迫する。", "胸骨圧迫の中断は、最小限にする。", "AEDの電極パッドを貼る際は、胸が濡れていてもそのまま貼り付ける。", "救助者が複数いる場合は、1〜2分ごとを目安に胸骨圧迫の役割を交代する。", "反応はないが普段どおりの呼吸をしている場合は、回復体位をとらせて救急隊の到着を待つ。"], "a": 3, "e": "胸が濡れている場合は、水分を拭き取ってから電極パッドを貼る。"}, {"id": 57, "s": "労働衛生（有害業務以外）", "f": "応急手当（出血）", "q": "出血及び止血に関する次の記述のうち、誤っているものはどれか。", "c": ["止血法は直接圧迫法が基本で、最も確実である。", "体内の全血液量は、体重の約13分の1程度である。", "全血液量の約3分の1を短時間に失うと、生命が危険な状態となる。", "静脈性出血は、浅い切り傷のときにみられ、傷口から少しずつにじみ出るような出血である。", "動脈性出血は、鮮紅色を呈し、拍動に合わせて噴出する。"], "a": 4, "e": "にじみ出る出血は毛細血管性出血。静脈性出血は暗赤色で、湧き出るように出血する。"}, {"id": 58, "s": "労働衛生（有害業務以外）", "f": "応急手当（骨折）", "q": "骨折及びその救急処置に関する次の記述のうち、誤っているものはどれか。", "c": ["脊髄損傷が疑われる場合は、硬い板の上に乗せて搬送する。", "単純骨折とは、皮膚の損傷がなく、骨折部が外部と通じていない骨折をいう。", "副子を当てるときは、骨折部の上下の関節を含めて固定する。", "複雑骨折とは、骨が多数の骨片に破砕された骨折をいう。", "不完全骨折は、骨にひびが入った状態で、変形はほとんどみられない。"], "a": 4, "e": "複雑骨折（開放骨折）は、皮膚・皮下組織が損傷し骨折端が外に出ている骨折。多数の骨片に砕けたものは粉砕骨折。"}, {"id": 59, "s": "労働衛生（有害業務以外）", "f": "応急手当（熱傷）", "q": "熱傷の救急処置等に関する次の記述のうち、誤っているものはどれか。", "c": ["水疱ができたときは、破らないようにして清潔なガーゼで覆う。", "熱傷の範囲が広い場合、全身を冷やし続けると低体温となるおそれがあるので注意する。", "衣服が皮膚に付着しているときは、無理にはがさずに、その上から冷やす。", "Ⅱ度熱傷は、皮膚が白っぽくなり、痛みを感じないことが特徴である。", "化学薬品による熱傷は、直ちに大量の水で洗い流す。"], "a": 4, "e": "皮膚が白色・黒色になり痛みを感じないことがあるのはⅢ度熱傷。Ⅱ度は水疱ができ、強い痛みを伴う。"}, {"id": 60, "s": "労働衛生（有害業務以外）", "f": "食中毒", "q": "細菌性食中毒に関する次の記述のうち、誤っているものはどれか。", "c": ["ボツリヌス菌は、缶詰や真空パック食品など酸素のない状態で増殖し、神経毒を産生する。", "腸炎ビブリオは病原性好塩菌ともいわれ、魚介類が原因となることが多い。", "腸炎ビブリオは熱に強く、加熱調理しても死滅しない。", "黄色ブドウ球菌が産生するエンテロトキシンは、熱に強い。", "サルモネラ菌による食中毒は、鶏卵や食肉が原因となることが多く、感染型に分類される。"], "a": 3, "e": "腸炎ビブリオは熱に弱く、加熱で死滅する。真水にも弱い。"}, {"id": 61, "s": "労働衛生（有害業務以外）", "f": "食中毒", "q": "食中毒に関する次の記述のうち、正しいものはどれか。", "c": ["ノロウイルスの消毒には、エタノールが最も有効である。", "カンピロバクターは、毒素型食中毒の代表的な原因菌である。", "ウェルシュ菌は好気性菌で、熱に弱い。", "腸管出血性大腸菌O-157は、ベロ毒素を産生し、腹痛や出血を伴う水様性の下痢などを起こす。", "ノロウイルスによる食中毒は、夏季に集中して発生する。"], "a": 4, "e": "ノロウイルスは冬季に多く、エタノールが効きにくいため次亜塩素酸ナトリウムで消毒する。ウェルシュ菌は嫌気性で芽胞は熱に強い。カンピロバクターは感染型。"}, {"id": 62, "s": "労働衛生（有害業務以外）", "f": "食中毒", "q": "次のAからDの細菌のうち、毒素型食中毒の原因菌の組合せとして、正しいものはどれか。\nA 黄色ブドウ球菌\nB ボツリヌス菌\nC サルモネラ菌\nD 腸炎ビブリオ", "c": ["A, B", "A, C", "B, C", "B, D", "C, D"], "a": 1, "e": "毒素型＝食品中で増殖した菌が産生した毒素による（黄色ブドウ球菌、ボツリヌス菌）。感染型＝菌そのものの感染による（サルモネラ菌、腸炎ビブリオ、カンピロバクター）。"}, {"id": 63, "s": "労働衛生（有害業務以外）", "f": "脳血管・心疾患", "q": "脳血管障害に関する次の記述のうち、誤っているものはどれか。", "c": ["出血性病変には、脳実質内に出血する脳出血と、脳表面のくも膜下腔に出血するくも膜下出血がある。", "虚血性病変のうち、脳血栓症は、脳血管自体の動脈硬化性病変によるものである。", "くも膜下出血の症状は、徐々に軽い頭痛が始まるのが典型的である。", "脳血管障害は、脳の血管の病変によるもので、出血性病変と虚血性病変に分類される。", "脳塞栓症は、心臓や動脈壁の血栓がはがれて脳血管を閉塞するものである。"], "a": 3, "e": "くも膜下出血は「突然の激しい頭痛」が典型的な症状。"}, {"id": 64, "s": "労働衛生（有害業務以外）", "f": "脳血管・心疾患", "q": "虚血性心疾患に関する次の記述のうち、正しいものはどれか。", "c": ["心筋梗塞の胸痛は、数秒から数分で治まり、安静にすると軽快する。", "虚血性心疾患の危険因子に、喫煙は含まれない。", "虚血性心疾患は、門脈による心筋への血液供給が不足して起こる。", "運動負荷心電図検査は、虚血性心疾患の発見には役立たない。", "狭心症は、心筋の一部に可逆的な虚血が起こるもので、発作は通常数分程度で治まる。"], "a": 5, "e": "心筋梗塞は締め付けられるような胸痛が30分以上続き、安静でも治まらない。喫煙・高血圧・脂質異常症は危険因子。心筋に血液を送るのは冠動脈。運動負荷心電図は狭心症の発見に有用。"}, {"id": 65, "s": "労働衛生（有害業務以外）", "f": "労働衛生統計", "q": "労働衛生管理に用いられる統計に関する次の記述のうち、誤っているものはどれか。", "c": ["ある時点での検査における有所見者の割合を有所見率といい、このようなデータを静態データという。", "生体から得られた諸指標の分布は、正規分布型になることが多い。", "集団を比較する場合、平均値が同じであっても分散が異なれば、異なった特徴をもつ集団であると評価される。", "ある事象と健康事象との間に統計上の相関関係が認められれば、両者の間には必ず因果関係がある。", "対象人数や受診者数などのデータを計数データといい、身長や体重などのデータを計量データという。"], "a": 4, "e": "相関関係があっても、因果関係があるとは限らない。"}, {"id": 66, "s": "労働衛生（有害業務以外）", "f": "労働衛生統計", "q": "疾病休業日数率を表す式として、正しいものはどれか。", "c": ["疾病休業延日数 ÷ 在籍労働者の延所定労働日数 × 100", "疾病休業件数 ÷ 在籍労働者数 × 1,000", "疾病休業延日数 ÷ 在籍労働者の延実労働時間数 × 1,000", "疾病休業件数 ÷ 在籍労働者の延実労働時間数 × 1,000,000", "疾病休業延日数 ÷ 在籍労働者数 × 100"], "a": 1, "e": "2＝病休件数年千人率、3＝病休強度率、4＝病休度数率。"}, {"id": 67, "s": "労働衛生（有害業務以外）", "f": "労働衛生統計", "q": "健康診断のスクリーニング等に関する次の記述のうち、正しいものはどれか。", "c": ["スクリーニングレベルを高く設定すると、偽陽性率は高くなり、偽陰性率は低くなる。", "偽陰性率とは、疾病無しの者を陽性と判定する率である。", "スクリーニングレベルを低く設定すると、偽陽性率は高くなり、偽陰性率は低くなる。", "ある期間における疾病の発生率のデータは、静態データである。", "偽陽性率とは、疾病有りの者を陰性と判定する率である。"], "a": 3, "e": "偽陽性＝疾病無しを陽性と判定、偽陰性＝疾病有りを陰性と判定。レベルを低くすると陽性が増え、偽陽性率が上がり偽陰性率が下がる。期間のデータは動態データ。"}, {"id": 68, "s": "労働衛生（有害業務以外）", "f": "メタボ・健康診断", "q": "メタボリックシンドロームの診断基準に関する次の記述のうち、誤っているものはどれか。", "c": ["腹囲が男性85cm以上、女性90cm以上の場合に腹部肥満とされる。", "腹部肥満に加え、血中脂質、血圧、空腹時血糖のうち2つ以上が基準値から外れている場合に、メタボリックシンドロームと診断される。", "BMIは、体重(kg)を身長(m)の2乗で除した値である。", "腹囲の基準は、内臓脂肪面積が男女とも50cm²以上に相当する値として定められている。", "日本の診断基準では、腹部肥満（内臓脂肪の蓄積）を必須条件としている。"], "a": 4, "e": "腹囲の基準は、内臓脂肪面積が男女とも100cm²以上に相当する値。"}, {"id": 69, "s": "労働衛生（有害業務以外）", "f": "感染症", "q": "感染症に関する次の記述のうち、誤っているものはどれか。", "c": ["感染が成立しても症状が現れない状態が継続することを、不顕性感染という。", "飛沫核が空気中に浮遊し、それを吸入することで感染することを空気感染といい、麻しんや結核が代表例である。", "人の抵抗力が低下した場合に、通常は病原性の弱い微生物によって発症することを、日和見感染という。", "不顕性感染のまま病原体を保有し、他人に感染させるおそれのある人をキャリアという。", "インフルエンザの主な感染経路は、経口感染である。"], "a": 5, "e": "インフルエンザの主な感染経路は飛沫感染（接触感染もある）。"}, {"id": 70, "s": "労働衛生（有害業務以外）", "f": "メタボ・健康診断", "q": "健康診断における血液検査に関する次の記述のうち、正しいものはどれか。", "c": ["γ-GTPは、アルコールを摂取しても上昇しない。", "血清トリグリセライド（中性脂肪）は、食後に低下する。", "HbA1cは、過去1〜2か月程度の平均的な血糖値を反映する。", "LDLコレステロールは善玉コレステロールとも呼ばれる。", "HDLコレステロールは悪玉コレステロールとも呼ばれ、高値が動脈硬化の危険因子となる。"], "a": 3, "e": "γ-GTPはアルコール摂取で上昇。HDLは善玉で低値が危険因子、LDLが悪玉。中性脂肪は食後に上昇する。"}, {"id": 71, "s": "関係法令（有害業務）", "f": "衛生管理者・産業医の選任", "q": "常時800人の労働者を使用する製造業の事業場の衛生管理体制に関する次の記述のうち、法令上、誤っているものはどれか。ただし、800人のうち、深夜業を含む業務に常時550人、多量の高熱物体を取り扱う業務に常時20人が従事しているものとする。", "c": ["衛生管理者は、3人以上選任しなければならない。", "衛生管理者のうち少なくとも1人を、専任の衛生管理者としなければならない。", "衛生管理者のうち1人を、衛生工学衛生管理者免許を受けた者から選任する必要はない。", "産業医は、この事業場に専属の者を選任しなければならない。", "衛生管理者は、選任すべき事由が発生した日から14日以内に選任しなければならない。"], "a": 2, "e": "専任が必要なのは「常時1,000人超」又は「常時500人超で、坑内労働や労基則18条の有害業務（多量の高熱物体の取扱い等）に常時30人以上」の場合。高熱業務は20人で、深夜業は18条の業務に含まれないので専任は不要。一方、産業医は「深夜業を含む業務」も含む特定業務に常時500人以上なので専属が必要。衛生管理者数は501〜1,000人で3人以上。"}, {"id": 72, "s": "関係法令（有害業務）", "f": "作業主任者", "q": "次の作業のうち、法令上、作業主任者の選任が義務付けられていないものはどれか。", "c": ["鉛蓄電池を製造する工程において鉛等の溶融を行う作業", "酸素欠乏危険場所における作業", "屋内作業場において有機溶剤を用いて行う塗装の作業", "屋内作業場における特定粉じん作業", "特定化学物質の第2類物質を取り扱う作業"], "a": 4, "e": "粉じん作業には作業主任者の選任義務はない（特定粉じん作業は特別教育が必要）。有機溶剤、特化物、酸欠、鉛はいずれも作業主任者が必要。"}, {"id": 73, "s": "関係法令（有害業務）", "f": "作業主任者", "q": "作業主任者と、その資格の組合せとして、法令上、正しいものはどれか。", "c": ["高圧室内作業主任者 ― 免許を受けた者", "ガンマ線透過写真撮影作業主任者 ― 技能講習修了者", "エックス線作業主任者 ― 技能講習修了者", "酸素欠乏危険作業主任者 ― 免許を受けた者", "有機溶剤作業主任者 ― 免許を受けた者"], "a": 1, "e": "免許が必要なのは高圧室内作業、エックス線作業、ガンマ線透過写真撮影作業の主任者。有機溶剤、特化物、鉛、酸欠、石綿などは技能講習修了者から選任する。"}, {"id": 74, "s": "関係法令（有害業務）", "f": "定期自主検査", "q": "次の設備のうち、法令に基づく定期自主検査の実施義務が規定されていないものはどれか。", "c": ["有機溶剤業務を行う屋内作業場に設けた全体換気装置", "特定粉じん発生源に設けた局所排気装置", "特定化学物質の第2類物質の粉じんが発散する屋内作業場に設けた局所排気装置", "第2種有機溶剤等を用いる屋内作業場に設けた局所排気装置", "鉛業務を行う屋内作業場に設けた局所排気装置"], "a": 1, "e": "全体換気装置には定期自主検査の規定がない。局所排気装置（有機・特化・鉛・粉じん）は1年以内ごとに1回検査し、記録を3年保存する。"}, {"id": 75, "s": "関係法令（有害業務）", "f": "作業環境測定", "q": "法令に基づく作業環境測定とその実施頻度の組合せとして、正しいものはどれか。", "c": ["酸素欠乏危険場所の空気中の酸素濃度 ― 1か月以内ごとに1回", "暑熱の屋内作業場の気温・湿度・ふく射熱 ― 1か月以内ごとに1回", "第2種有機溶剤等を用いる屋内作業場の有機溶剤濃度 ― 6か月以内ごとに1回", "著しい騒音を発する屋内作業場の等価騒音レベル ― 1年以内ごとに1回", "鉛業務を行う屋内作業場の空気中の鉛濃度 ― 6か月以内ごとに1回"], "a": 3, "e": "鉛は1年以内ごと、暑熱・寒冷・多湿の屋内作業場は半月以内ごと、酸欠危険場所はその日の作業開始前、騒音は6か月以内ごと。"}, {"id": 76, "s": "関係法令（有害業務）", "f": "作業環境測定", "q": "法令に基づく作業環境測定に関する次の組合せのうち、誤っているものはどれか。", "c": ["放射線業務を行う管理区域の外部放射線による線量当量率 ― 1か月以内ごとに1回", "石綿等を取り扱う屋内作業場の石綿の空気中濃度 ― 1年以内ごとに1回", "常時特定粉じん作業を行う屋内作業場の粉じん濃度 ― 6か月以内ごとに1回（記録7年保存）", "中央管理方式の空気調和設備を設けた事務室の一酸化炭素・二酸化炭素濃度 ― 2か月以内ごとに1回", "特定化学物質（第1類・第2類）を製造し、又は取り扱う屋内作業場の濃度 ― 6か月以内ごとに1回"], "a": 2, "e": "石綿は6か月以内ごとに1回（記録40年保存）。"}, {"id": 77, "s": "関係法令（有害業務）", "f": "特殊健康診断", "q": "特殊健康診断に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["有機溶剤業務に常時従事する労働者には、雇入れ時、配置替え時及びその後6か月以内ごとに1回、有機溶剤等健康診断を行う。", "鉛業務に常時従事する労働者には、雇入れ時、配置替え時及びその後6か月以内ごとに1回、鉛健康診断を行う。", "特定化学物質（第1類・第2類）を取り扱う業務に常時従事する労働者には、雇入れ時、配置替え時及びその後6か月以内ごとに1回、特定化学物質健康診断を行う。", "特殊健康診断の結果の報告は、常時50人以上の労働者を使用する事業場に限って義務付けられている。", "塩酸、硝酸、硫酸等のガス、蒸気又は粉じんを発散する場所における業務に常時従事する労働者には、6か月以内ごとに1回、歯科医師による健康診断を行う。"], "a": 4, "e": "特殊健康診断の結果報告は、事業場の規模にかかわらず遅滞なく所轄労働基準監督署長に提出する。規模要件（常時50人以上）があるのは一般の定期健康診断の結果報告。"}, {"id": 78, "s": "関係法令（有害業務）", "f": "記録の保存期間", "q": "健康診断の結果に基づく記録とその保存期間の組合せとして、法令上、誤っているものはどれか。", "c": ["有機溶剤等健康診断個人票 ― 5年間", "じん肺健康診断に関する記録 ― 3年間", "電離放射線健康診断個人票 ― 30年間", "石綿健康診断個人票 ― 常時従事しなくなった日から40年間", "鉛健康診断個人票 ― 5年間"], "a": 2, "e": "じん肺健康診断の記録とエックス線写真は7年間保存。特別管理物質の特化物健診は30年。"}, {"id": 79, "s": "関係法令（有害業務）", "f": "酸素欠乏", "q": "酸素欠乏症等防止規則に関する次の記述のうち、誤っているものはどれか。", "c": ["酸素欠乏とは、空気中の酸素の濃度が18%未満である状態をいう。", "第一種酸素欠乏危険作業では、作業中、空気中の酸素濃度を16%以上に保つように換気しなければならない。", "酸素欠乏危険作業に労働者を従事させる場合は、その日の作業を開始する前に、作業場の空気中の酸素濃度を測定しなければならない。", "酸素欠乏危険作業を行う場所の換気には、純酸素を使用してはならない。", "酸素欠乏危険作業に労働者を従事させるときは、入場及び退場の際に人員を点検しなければならない。"], "a": 2, "e": "換気によって酸素濃度を18%以上に保つ（第二種は硫化水素10ppm以下も）。"}, {"id": 80, "s": "関係法令（有害業務）", "f": "酸素欠乏", "q": "酸素欠乏症等防止規則に関する次の記述のうち、正しいものはどれか。", "c": ["第二種酸素欠乏危険作業では、硫化水素の濃度を100ppm以下に保てばよい。", "酸素欠乏危険作業に係る業務に労働者を就かせるときは、特別の教育を行わなければならない。", "酸素欠乏のおそれがある場所では、有効な防毒マスクを使用させる。", "酸素濃度等の測定の記録は、1年間保存すればよい。", "酸素欠乏危険作業主任者は、免許を受けた者のうちから選任しなければならない。"], "a": 2, "e": "作業主任者は技能講習修了者。硫化水素は10ppm以下。測定記録は3年保存。酸欠場所では空気呼吸器・送気マスク等を使う（防毒マスクは不可）。"}, {"id": 81, "s": "関係法令（有害業務）", "f": "特別教育", "q": "次の業務のうち、法令上、特別教育の実施が義務付けられていないものはどれか。", "c": ["石綿等が使用されている建築物の解体等の作業に係る業務", "特定粉じん作業に係る業務", "酸素欠乏危険場所における作業に係る業務", "有機溶剤等を用いて行う接着の業務", "エックス線装置を用いて行う透過写真撮影の業務"], "a": 4, "e": "有機溶剤業務と特定化学物質業務には特別教育の規定がない（作業主任者が必要）。"}, {"id": 82, "s": "関係法令（有害業務）", "f": "譲渡等の制限", "q": "厚生労働大臣が定める規格を具備しなければ譲渡し、貸与し、又は設置してはならない機械等に該当しないものはどれか。", "c": ["防毒マスク（有機ガス用）", "電動ファン付き呼吸用保護具", "送気マスク", "防じんマスク（ろ過材及び面体を有するもの）", "再圧室"], "a": 3, "e": "送気マスクは譲渡等制限の対象外。防じんマスク、防毒マスク（ハロゲンガス用・有機ガス用・一酸化炭素用・アンモニア用・亜硫酸ガス用）、電動ファン付き呼吸用保護具、再圧室、潜水器などが対象。"}, {"id": 83, "s": "関係法令（有害業務）", "f": "製造許可・禁止", "q": "次の化学物質のうち、製造に厚生労働大臣の許可を必要とするものはどれか。", "c": ["ジクロロベンジジン", "ベータ-ナフチルアミン", "黄りんマッチ", "石綿", "ベンジジン"], "a": 1, "e": "ジクロロベンジジン、アルファ-ナフチルアミン、オルト-トリジン、ベリリウム、PCB等は製造許可物質（特化物第1類）。ベンジジン、ベータ-ナフチルアミン、石綿、黄りんマッチは製造等禁止。"}, {"id": 84, "s": "関係法令（有害業務）", "f": "労基法（有害業務）", "q": "労働基準法に基づき、時間外労働を1日2時間を超えて延長してはならない業務に該当しないものはどれか。", "c": ["異常気圧下における業務", "土石、獣毛等のじんあい又は粉末を著しく飛散する場所における業務", "著しく寒冷な場所における業務", "多量の高熱物体を取り扱う業務", "病原体によって汚染のおそれが著しい業務"], "a": 5, "e": "対象は坑内労働と労基則18条の業務（高熱、寒冷、有害放射線、粉じん、異常気圧、振動、重量物、強烈な騒音、鉛・水銀等の有害物）。病原体による汚染の業務は含まれない。"}, {"id": 85, "s": "関係法令（有害業務）", "f": "労基法（有害業務）", "q": "女性労働基準規則により、満18歳以上の女性（妊産婦以外）を就かせてはならない業務はどれか。", "c": ["断続作業として20kgの重量物を取り扱う業務", "継続作業として20kg以上の重量物を取り扱う業務", "異常気圧下における業務", "多量の高熱物体を取り扱う業務", "さく岩機等の身体に著しい振動を与える機械器具を用いて行う業務"], "a": 2, "e": "満18歳以上の女性は、断続作業30kg以上・継続作業20kg以上の重量物取扱いが禁止。3〜5は妊産婦（妊婦・産婦）について制限される業務。"}, {"id": 86, "s": "関係法令（有害業務）", "f": "電離放射線", "q": "電離放射線障害防止規則に関する次の記述のうち、誤っているものはどれか。", "c": ["女性の放射線業務従事者（妊娠する可能性がないと診断された者等を除く）の実効線量は、3か月間につき5mSvを超えないようにする。", "皮膚に受ける等価線量は、1年間につき500mSvを超えないようにする。", "管理区域とは、外部放射線と空気中の放射性物質による実効線量の合計が1年間につき1.3mSvを超えるおそれのある区域をいう。", "放射線業務従事者の実効線量は、5年間につき100mSvを超えず、かつ、1年間につき50mSvを超えないようにする。", "眼の水晶体に受ける等価線量は、5年間につき100mSv及び1年間につき50mSvを超えないようにする。"], "a": 3, "e": "管理区域は「3か月間につき1.3mSv」を超えるおそれのある区域。"}, {"id": 87, "s": "関係法令（有害業務）", "f": "じん肺法", "q": "じん肺法に関する次の記述のうち、誤っているものはどれか。", "c": ["じん肺管理区分は、管理1から管理4までに区分される。", "常時粉じん作業に従事する労働者で、じん肺管理区分が管理1の者には、3年以内ごとに1回、定期のじん肺健康診断を行う。", "常時粉じん作業に従事する労働者で、じん肺管理区分が管理2又は管理3の者には、1年以内ごとに1回、定期のじん肺健康診断を行う。", "じん肺健康診断の結果に関する記録とエックス線写真は、7年間保存する。", "じん肺管理区分が管理4と決定された者は、療養を要しない。"], "a": 5, "e": "管理4と決定された者は療養を要する。"}, {"id": 88, "s": "関係法令（有害業務）", "f": "有機溶剤中毒予防規則", "q": "有機溶剤中毒予防規則に関する次の記述のうち、正しいものはどれか。", "c": ["有機溶剤等を入れたことのある容器で蒸気が発散するおそれのあるものは、開放したまま屋内に置いておく。", "囲い式フードの局所排気装置の制御風速は、0.4m/秒以上としなければならない。", "有機溶剤作業主任者は、特別教育を修了した者のうちから選任する。", "外付け式フードの上方吸引型の局所排気装置の制御風速は、0.5m/秒以上であればよい。", "第3種有機溶剤等の区分の色分けによる表示は赤である。"], "a": 2, "e": "外付け式は側方・下方吸引型0.5m/秒、上方吸引型1.0m/秒。空容器は密閉するか屋外の一定場所に集積する。区分表示は第1種赤・第2種黄・第3種青。作業主任者は技能講習修了者。"}, {"id": 89, "s": "関係法令（有害業務）", "f": "粉じん障害防止規則", "q": "粉じん障害防止規則に関する次の記述のうち、誤っているものはどれか。", "c": ["常時特定粉じん作業を行う屋内作業場では、6か月以内ごとに1回、空気中の粉じん濃度を測定し、その記録を7年間保存する。", "粉じん作業を行う屋内作業場は、毎日1回以上、清掃を行わなければならない。", "粉じん作業を行う屋内作業場の床等は、1年以内ごとに1回、真空掃除機又は水洗いによって清掃しなければならない。", "特定粉じん発生源については、局所排気装置の設置、湿潤な状態に保つための設備の設置等の措置を講じなければならない。", "粉じん作業に従事する労働者のための休憩設備は、粉じん作業を行う作業場以外の場所に設ける。"], "a": 3, "e": "床等の真空掃除機・水洗い等による清掃は1か月以内ごとに1回。"}, {"id": 90, "s": "関係法令（有害業務）", "f": "特定化学物質障害予防規則", "q": "特定化学物質障害予防規則に関する次の記述のうち、誤っているものはどれか。", "c": ["特定化学物質作業主任者は、技能講習を修了した者のうちから選任する。", "特定化学物質健康診断個人票は、すべての物質について3年間保存すればよい。", "特別管理物質に係る作業環境測定の記録は、30年間保存する。", "特別管理物質を取り扱う作業に常時従事する労働者については、作業の記録を作成し30年間保存する。", "第1類物質・第2類物質を取り扱う局所排気装置は、1年以内ごとに1回、定期自主検査を行う。"], "a": 2, "e": "特化物健康診断個人票は5年保存、特別管理物質は30年保存。"}, {"id": 91, "s": "関係法令（有害業務）", "f": "熱中症対策の義務化", "q": "2025年6月施行の改正労働安全衛生規則による熱中症対策に関する次の記述のうち、誤っているものはどれか。", "c": ["これらの義務は、屋外作業だけでなく屋内作業にも適用される。", "熱中症のおそれがある作業者を把握した場合の、作業からの離脱、身体の冷却、医療機関への搬送等の措置の内容と実施手順を定め、関係作業者に周知しなければならない。", "これらの義務は、常時50人以上の労働者を使用する事業場に限り適用される。", "熱中症の自覚症状がある作業者や、熱中症のおそれがある作業者を見つけた者が報告するための体制を整備し、関係作業者に周知しなければならない。", "対象は、WBGT28℃以上又は気温31℃以上の環境下で、連続1時間以上又は1日4時間を超えて行われることが見込まれる作業である。"], "a": 3, "e": "事業場の規模にかかわらず適用される。直近の法改正なので要注意。"}, {"id": 92, "s": "関係法令（有害業務）", "f": "化学物質の自律的管理", "q": "2024年4月施行の化学物質管理に関する改正に関する次の記述のうち、誤っているものはどれか。", "c": ["化学物質管理者は、選任すべき事由が発生した日から14日以内に選任しなければならない。", "リスクアセスメントの結果に基づく措置として労働者に保護具を使用させる場合は、保護具着用管理責任者を選任しなければならない。", "リスクアセスメント対象物を製造し、又は取り扱う事業場では、化学物質管理者を選任しなければならない。", "化学物質管理者の選任は、常時50人以上の労働者を使用する事業場に限られる。", "雇入れ時等の安全衛生教育について、一定の業種で一部の教育項目を省略できる規定は廃止された。"], "a": 4, "e": "化学物質管理者は、リスクアセスメント対象物を製造・取扱うすべての事業場で、規模にかかわらず選任が必要。"}, {"id": 93, "s": "関係法令（有害業務）", "f": "記録の保存期間", "q": "作業環境測定の記録の保存期間として、法令上、誤っているものはどれか。", "c": ["特定粉じんの測定記録 ― 7年間", "特別管理物質以外の特定化学物質の測定記録 ― 30年間", "石綿の測定記録 ― 40年間", "有機溶剤（第1種・第2種）の測定記録 ― 3年間", "鉛の測定記録 ― 3年間"], "a": 2, "e": "特別管理物質以外の特化物は3年間。特別管理物質は30年間。"}, {"id": 94, "s": "関係法令（有害業務）", "f": "特定業務従事者の健康診断", "q": "特定業務従事者の健康診断に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["一定の要件を満たす深夜業従事者は、自ら受けた健康診断の結果を事業者に提出することができる。", "特定業務従事者の健康診断のうち胸部エックス線検査は、1年以内ごとに1回、定期に行えば足りる。", "多量の高熱物体を取り扱う業務は、特定業務に該当する。", "特定業務従事者の健康診断は、雇入れ時に行えば、定期に行う必要はない。", "深夜業を含む業務に常時従事する労働者には、その業務への配置替えの際及び6か月以内ごとに1回、定期に健康診断を行う。"], "a": 4, "e": "配置替えの際と、その後6か月以内ごとに1回、定期に行う必要がある。"}, {"id": 95, "s": "関係法令（有害業務以外）", "f": "衛生管理者", "q": "衛生管理者に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["常時50人以上の労働者を使用する事業場では、衛生管理者を選任しなければならない。", "2人以上の衛生管理者を選任する場合でも、全員を事業場に専属の者としなければならず、労働衛生コンサルタントを選任することはできない。", "衛生管理者を選任したときは、遅滞なく、所轄労働基準監督署長に報告しなければならない。", "衛生管理者は、少なくとも毎週1回作業場等を巡視しなければならない。", "製造業の事業場では、第二種衛生管理者免許を有する者を衛生管理者に選任することはできない。"], "a": 2, "e": "2人以上選任する場合、そのうち1人は事業場に専属でない労働衛生コンサルタントでもよい。"}, {"id": 96, "s": "関係法令（有害業務以外）", "f": "産業医", "q": "産業医に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["産業医を選任したときは、遅滞なく、所轄労働基準監督署長に報告しなければならない。", "常時50人以上の労働者を使用する事業場では、産業医を選任しなければならない。", "事業者が毎月1回以上、衛生管理者の巡視結果等の情報を産業医に提供し、産業医の同意を得た場合は、産業医の作業場等の巡視を2か月に1回以上とすることができる。", "常時1,000人以上の労働者を使用する事業場では、専属の産業医を選任しなければならない。", "法人の代表者が医師であれば、その者を当該事業場の産業医に選任することができる。"], "a": 5, "e": "法人の代表者、事業を営む個人、事業場の運営を統括管理する者は、産業医に選任できない。"}, {"id": 97, "s": "関係法令（有害業務以外）", "f": "衛生委員会", "q": "衛生委員会に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["衛生委員会の議長は、原則として、総括安全衛生管理者又は事業の実施を統括管理する者等がなる。", "衛生委員会の議事で重要なものの記録は、3年間保存しなければならない。", "衛生委員会は、毎月1回以上開催するようにしなければならない。", "議長を除く委員の半数は、過半数労働組合（ない場合は過半数代表者）の推薦に基づき指名しなければならない。", "衛生委員会の委員として指名できる産業医は、その事業場に専属の産業医に限られる。"], "a": 5, "e": "専属でない産業医も、その事業場の産業医であれば委員に指名できる。"}, {"id": 98, "s": "関係法令（有害業務以外）", "f": "一般健康診断", "q": "雇入れ時の健康診断に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["雇入れ時の健康診断の項目には、血中脂質検査や心電図検査が含まれる。", "雇入れ時の健康診断の結果に基づき健康診断個人票を作成し、5年間保存しなければならない。", "雇入れ時の聴力の検査は、1,000Hz及び4,000Hzの音について行う。", "常時50人以上の労働者を使用する事業場では、雇入れ時の健康診断の結果を所轄労働基準監督署長に報告しなければならない。", "雇入れ時の健康診断の項目は、医師が必要でないと認めても省略できない。ただし、3か月以内に受けた健診の結果を証明する書面を提出したときは、その項目に相当する項目を省略できる。"], "a": 4, "e": "雇入れ時の健康診断には報告義務がない。報告が必要なのは常時50人以上の事業場の定期健康診断。"}, {"id": 99, "s": "関係法令（有害業務以外）", "f": "一般健康診断", "q": "定期健康診断に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["健康診断を受けた労働者に対し、遅滞なく、その結果を通知しなければならない。", "常時使用する労働者に対し、1年以内ごとに1回、定期に健康診断を行わなければならない。", "常時50人以上の労働者を使用する事業場では、定期健康診断結果報告書を遅滞なく所轄労働基準監督署長に提出しなければならない。", "定期健康診断の項目のうち、身長の検査は、医師が必要でないと認めても省略することはできない。", "健康診断の結果、異常の所見があると診断された労働者について、健康診断が行われた日から3か月以内に医師の意見を聴かなければならない。"], "a": 4, "e": "身長の検査は、20歳以上の者について医師が必要でないと認めるときは省略できる。"}, {"id": 100, "s": "関係法令（有害業務以外）", "f": "長時間労働者の面接指導", "q": "労働安全衛生法に基づく医師による面接指導に関する次の記述のうち、誤っているものはどれか。", "c": ["面接指導の結果に基づく記録を作成し、5年間保存しなければならない。", "面接指導の結果に基づき、労働者の健康を保持するために必要な措置について、医師の意見を聴かなければならない。", "休憩時間を除き1週40時間を超えて労働させた時間が1か月80時間を超え、疲労の蓄積が認められる労働者が申し出た場合は、面接指導を行わなければならない。", "事業者は、タイムカードによる記録、パソコン等の使用時間の記録等の客観的な方法等により、労働者の労働時間の状況を把握しなければならない。", "研究開発業務に従事する労働者は、時間外・休日労働が1か月100時間を超えても、本人の申出がなければ面接指導を行う必要はない。"], "a": 5, "e": "研究開発業務従事者で月100時間を超えた者は、申出がなくても面接指導を行わなければならない。"}, {"id": 101, "s": "関係法令（有害業務以外）", "f": "ストレスチェック", "q": "ストレスチェック及び面接指導に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["常時50人以上の労働者を使用する事業場では、1年以内ごとに1回、定期にストレスチェックを行わなければならない。", "労働者の解雇、昇進又は異動に関して直接の権限を持つ監督的地位にある者は、ストレスチェックの実施の事務に従事してはならない。", "ストレスチェックの実施者は、医師、保健師、又は所定の研修を修了した歯科医師、看護師、精神保健福祉士若しくは公認心理師である。", "高ストレスと判定された労働者には、本人の申出がなくても、医師による面接指導を行わなければならない。", "ストレスチェックの結果は、実施者から直接本人に通知され、本人の同意なく事業者に提供してはならない。"], "a": 4, "e": "面接指導は、高ストレスで面接指導が必要と判断された労働者から「申出があったとき」に行う。"}, {"id": 102, "s": "関係法令（有害業務以外）", "f": "ストレスチェック", "q": "ストレスチェックに関する次の記述のうち、法令上、正しいものはどれか。", "c": ["常時50人以上の労働者を使用する事業場では、1年以内ごとに1回、検査結果等報告書を所轄労働基準監督署長に提出しなければならない。", "ストレスチェックの結果は、本人の同意がなくても事業者が自由に閲覧してよい。", "面接指導の結果の記録は、3年間保存すればよい。", "面接指導の申出をしたことを理由として、労働者に不利益な取扱いをしてもよい。", "衛生管理者の資格があれば、それだけでストレスチェックの実施者になることができる。"], "a": 1, "e": "面接指導の記録は5年保存。衛生管理者の資格だけでは実施者になれない。不利益な取扱いは禁止。"}, {"id": 103, "s": "関係法令（有害業務以外）", "f": "事務所衛生基準規則", "q": "事務所衛生基準規則に関する次の記述のうち、誤っているものはどれか。", "c": ["空気調和設備を設けている場合は、室の気温が18℃以上28℃以下、相対湿度が40%以上70%以下になるよう努めなければならない。", "燃焼器具を使用する室では、器具の異常の有無を1か月以内ごとに1回点検しなければならない。", "空気調和設備を設けている場合は、室に供給される空気中の一酸化炭素を10ppm以下、二酸化炭素を1,000ppm以下としなければならない。", "労働者を常時就業させる室の気積は、設備の占める容積及び床面から4mを超える高さにある空間を除き、労働者1人について10m³以上としなければならない。", "直接外気に向かって開放できる窓等の部分の面積が、常時床面積の20分の1以上になるようにしなければならない。"], "a": 2, "e": "燃焼器具は毎日点検する。室温の下限は2022年の改正で17℃から18℃に変更された。"}, {"id": 104, "s": "関係法令（有害業務以外）", "f": "事務所衛生基準規則", "q": "事務所衛生基準規則に関する次の記述のうち、正しいものはどれか。", "c": ["大掃除は、1年以内ごとに1回、定期に統一的に行えばよい。", "常時50人以上又は常時女性30人以上の労働者を使用するときは、労働者が臥床できる休養室又は休養所を、男性用と女性用に区別して設けなければならない。", "機械による換気のための設備は、6か月以内ごとに1回、定期に点検すればよい。", "空気調和設備により室に流入する空気の気流は、1.0m/秒以下としなければならない。", "空気調和設備の加湿装置は、1年以内ごとに1回、定期に点検すればよい。"], "a": 2, "e": "大掃除は6か月以内ごと、機械換気設備の点検は2か月以内ごと、加湿装置の点検は1か月以内ごと、気流は0.5m/秒以下。"}, {"id": 105, "s": "関係法令（有害業務以外）", "f": "労基法（妊産婦）", "q": "労働基準法に基づく妊産婦等の保護に関する次の記述のうち、誤っているものはどれか。", "c": ["生後満1年に達しない生児を育てる女性は、休憩時間のほか、1日2回各々少なくとも30分、育児時間を請求することができる。", "産後8週間を経過しない女性を就業させてはならない。ただし、産後6週間を経過した女性が請求した場合で、医師が支障がないと認めた業務に就かせることは差し支えない。", "6週間（多胎妊娠の場合は14週間）以内に出産する予定の女性が休業を請求した場合は、就業させてはならない。", "妊産婦が請求した場合は、時間外労働、休日労働又は深夜業をさせてはならない。", "妊産婦が請求した場合でも、管理監督者である妊産婦には深夜業をさせることができる。"], "a": 5, "e": "管理監督者は労働時間・休日の規定が適用除外となるが、深夜業の規定は適用される。請求があれば深夜業はさせられない。"}, {"id": 106, "s": "関係法令（有害業務以外）", "f": "労基法（妊産婦）", "q": "労働基準法に基づく女性の保護に関する次の記述のうち、正しいものはどれか。", "c": ["1年単位の変形労働時間制を採用している場合でも、妊産婦が請求したときは、1週40時間、1日8時間を超えて労働させてはならない。", "生理日の休暇は、有給としなければならない。", "生理日の就業が著しく困難な女性に対する休暇の日数は、就業規則で上限を定めることができる。", "フレックスタイム制を採用している場合でも、妊産婦が請求したときは、1日8時間を超えて労働させてはならない。", "育児時間は、1日1回30分である。"], "a": 1, "e": "変形労働時間制（1か月・1年・1週単位）の場合は妊産婦の請求で法定時間を超えられないが、フレックスタイム制は対象外。生理休暇は日数制限不可で、有給か無給かは自由。育児時間は1日2回各30分以上。"}, {"id": 107, "s": "関係法令（有害業務以外）", "f": "年次有給休暇", "q": "週所定労働時間25時間、週所定労働日数4日のパートタイム労働者で、雇入れの日から3年6か月継続勤務し、直前の1年間に全労働日の8割以上出勤した者に新たに与えなければならない年次有給休暇の日数は、法令上、何日か。", "c": ["8日", "9日", "10日", "12日", "14日"], "a": 3, "e": "週30時間未満・週4日の比例付与は、6か月7日→1年6か月8日→2年6か月9日→3年6か月10日→4年6か月12日→5年6か月13日→6年6か月以上15日。"}, {"id": 108, "s": "関係法令（有害業務以外）", "f": "年次有給休暇", "q": "年次有給休暇に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["年10日以上の年次有給休暇が付与される労働者には、付与日から1年以内に3日について、時季を指定して取得させなければならない。", "年次有給休暇の請求権は、2年間で時効により消滅する。", "雇入れの日から6か月間継続勤務し、全労働日の8割以上出勤した労働者には、10日の年次有給休暇を与えなければならない。", "業務上の負傷・疾病による療養のために休業した期間は、出勤率の算定上、出勤したものとみなす。", "育児休業、介護休業、産前産後の休業期間は、出勤率の算定上、出勤したものとみなす。"], "a": 1, "e": "時季指定義務は年5日。"}, {"id": 109, "s": "関係法令（有害業務以外）", "f": "労働時間・休憩", "q": "労働基準法の労働時間・休憩に関する次の記述のうち、誤っているものはどれか。", "c": ["監視又は断続的労働に従事する労働者で、所轄労働基準監督署長の許可を受けた者には、年次有給休暇の規定も適用されない。", "法定労働時間は、原則として1週40時間、1日8時間である。", "労働時間が6時間を超える場合は少なくとも45分、8時間を超える場合は少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。", "監視又は断続的労働に従事する労働者で、所轄労働基準監督署長の許可を受けた者には、労働時間、休憩及び休日の規定は適用されない。", "休憩時間は、原則として一斉に与え、自由に利用させなければならない。"], "a": 1, "e": "適用除外は労働時間・休憩・休日の規定のみ。年次有給休暇と深夜業の規定は適用される。"}, {"id": 110, "s": "関係法令（有害業務以外）", "f": "変形労働時間制", "q": "労働基準法の労働時間制度に関する次の記述のうち、正しいものはどれか。", "c": ["時間外・休日労働に関する協定（36協定）は、締結すれば届出は不要である。", "1年単位の変形労働時間制の労使協定は、所轄労働基準監督署長への届出が不要である。", "フレックスタイム制の清算期間は、1か月以内に限られる。", "1か月単位の変形労働時間制は、労使協定又は就業規則その他これに準ずるものにより定める。", "1週間単位の非定型的変形労働時間制は、すべての業種で採用できる。"], "a": 4, "e": "フレックスタイム制の清算期間は3か月以内（1か月超は届出が必要）。1年単位は届出が必要。1週間単位は常時30人未満の小売業、旅館、料理店、飲食店に限られる。36協定は届出が必要。"}, {"id": 111, "s": "関係法令（有害業務以外）", "f": "衛生推進者", "q": "衛生推進者に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["衛生推進者は、衛生管理者免許を有する者でなければならない。", "衛生推進者を選任しても、所轄労働基準監督署長への報告は不要である。", "衛生推進者を選任したときは、その氏名を作業場の見やすい箇所に掲示する等により関係労働者に周知させなければならない。", "衛生推進者は、常時10人以上50人未満の労働者を使用する事業場で選任する。", "衛生推進者は、選任すべき事由が発生した日から14日以内に選任しなければならない。"], "a": 1, "e": "衛生推進者は、所定の講習を修了した者など一定の能力を有する者から選任すればよく、衛生管理者免許は不要。"}, {"id": 112, "s": "関係法令（有害業務以外）", "f": "健康診断後の措置", "q": "健康診断の実施後の措置に関する次の記述のうち、法令上、誤っているものはどれか。", "c": ["健康診断個人票は5年間保存しなければならない。", "特に健康の保持に努める必要がある労働者に対し、医師又は保健師による保健指導を行うよう努めなければならない。", "異常の所見がある労働者について医師等の意見を聴き、必要があるときは就業場所の変更、作業の転換、労働時間の短縮等の措置を講じる。", "医師等の意見は、健康診断個人票に記載しなければならない。", "常時50人未満の労働者を使用する事業場では、健康診断の結果を労働者に通知する必要はない。"], "a": 5, "e": "結果の通知は規模にかかわらず必要。"}, {"id": 113, "s": "関係法令（有害業務以外）", "f": "総括安全衛生管理者", "q": "次の業種と常時使用する労働者数の組合せのうち、総括安全衛生管理者の選任が法令上必要なものはどれか。", "c": ["各種商品小売業 ― 常時250人", "建設業 ― 常時120人", "製造業 ― 常時250人", "金融業 ― 常時800人", "医療業 ― 常時800人"], "a": 2, "e": "林業・鉱業・建設業・運送業・清掃業は常時100人以上、製造業・各種商品小売業等は常時300人以上、その他の業種（金融業、医療業等）は常時1,000人以上で選任が必要。"}, {"id": 114, "s": "関係法令（有害業務以外）", "f": "労基法（年少者）", "q": "労働基準法の年少者の保護に関する次の記述のうち、誤っているものはどれか。", "c": ["満18歳未満の者を坑内で労働させてはならない。", "満18歳未満の者を、原則として午後10時から午前5時までの間に使用してはならない。", "満18歳未満の者でも、親権者の同意があれば深夜業に従事させることができる。", "満18歳未満の者には、原則として時間外労働や休日労働をさせてはならない。", "満18歳未満の者を使用する場合は、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。"], "a": 3, "e": "親権者の同意があっても深夜業は原則として禁止（交替制で使用する満16歳以上の男性などの例外を除く）。"}, {"id": 115, "s": "労働生理", "f": "呼吸", "q": "呼吸に関する次の記述のうち、誤っているものはどれか。", "c": ["血液中の二酸化炭素濃度が低下すると、呼吸中枢が刺激されて呼吸が深くなり、呼吸数が増加する。", "呼吸中枢は延髄にあり、ここからの刺激によって呼吸に関与する筋肉が支配されている。", "肺胞内の空気と、肺胞を取り巻く毛細血管中の血液との間で行われるガス交換を外呼吸という。", "呼吸運動は、主として肋間筋と横隔膜の協調運動によって胸郭内容積を周期的に増減させて行われる。", "全身の毛細血管中の血液と各組織細胞との間で行われるガス交換を内呼吸という。"], "a": 1, "e": "呼吸中枢を刺激するのは血液中の二酸化炭素濃度の「増加」。"}, {"id": 116, "s": "労働生理", "f": "呼吸", "q": "呼吸に関する次の記述のうち、正しいものはどれか。", "c": ["成人の呼吸数は、通常、1分間に16〜20回で、食事、入浴、発熱によって増加する。", "安静時の成人の1回換気量は、約1,500mLである。", "チェーンストークス呼吸は、肺の機能が低下したときにのみみられる呼吸である。", "肺は、自ら運動して空気を出し入れしている。", "呼気中の二酸化炭素濃度は、約16%である。"], "a": 1, "e": "肺自体には運動能力がなく、呼吸筋で胸郭を動かす。呼気はCO₂約4%・O₂約16%。チェーンストークス呼吸は脳や心臓の疾患などでみられる。1回換気量は約500mL。"}, {"id": 117, "s": "労働生理", "f": "心臓・循環", "q": "心臓及び血液循環に関する次の記述のうち、誤っているものはどれか。", "c": ["肺動脈を流れる血液は動脈血であり、肺静脈を流れる血液は静脈血である。", "体循環では、血液は左心室から大動脈に入り、毛細血管を経て静脈血となり、右心房に戻る。", "心臓は、自律神経の支配を受けているが、洞結節（洞房結節）で発生した刺激が刺激伝導系を介して心筋に伝わることにより、規則正しく収縮と拡張を繰り返す。", "肺循環では、血液は右心室から肺動脈を経て肺の毛細血管に入り、肺静脈を通って左心房に戻る。", "心臓の筋肉に酸素や栄養を供給するのは冠動脈である。"], "a": 1, "e": "肺動脈には静脈血、肺静脈には動脈血が流れる（名前と中身が逆になる点が頻出）。"}, {"id": 118, "s": "労働生理", "f": "心臓・循環", "q": "心臓及び血液循環に関する次の記述のうち、正しいものはどれか。", "c": ["血圧は、静脈内の血液が血管壁に及ぼす圧力である。", "動脈硬化とは、動脈壁が柔らかくなり弾力性が増す状態である。", "大動脈を流れる血液は静脈血である。", "脈拍は、心臓の拍動による動脈の拍動を末梢の動脈で触知したもので、一般に手首の橈骨動脈で触知する。", "心筋は平滑筋であり、意思によって動かすことができない不随意筋である。"], "a": 4, "e": "心筋は横紋筋だが不随意筋。血圧は動脈の血管壁にかかる圧力。大動脈は動脈血。動脈硬化は壁が硬くなり弾力性を失った状態。"}, {"id": 119, "s": "労働生理", "f": "血液", "q": "血液に関する次の記述のうち、誤っているものはどれか。", "c": ["血小板は、止血作用をもつ。", "ヘマトクリットは、血液の容積に対する赤血球の相対的容積で、男性のほうが女性より高い。", "赤血球の寿命は約120日で、白血球に比べて長い。", "血液は、血漿と有形成分から成り、血漿は血液の容積の約55%を占める。", "血液の凝固は、血漿中のフィブリン（線維素）がフィブリノーゲン（線維素原）に変化する現象である。"], "a": 5, "e": "凝固は、水溶性のフィブリノーゲンが不溶性のフィブリンに変化する現象。"}, {"id": 120, "s": "労働生理", "f": "血液", "q": "血液に関する次の記述のうち、正しいものはどれか。", "c": ["血漿中の蛋白質のうち、グロブリンは血液の浸透圧の維持に関与している。", "ABO式血液型は、白血球の型による分類である。", "赤血球は、主に脾臓で産生される。", "リンパ球には、抗体を産生するBリンパ球と、細胞性免疫の作用をもつTリンパ球がある。", "好中球は白血球の約30%を占め、抗体を産生する。"], "a": 4, "e": "好中球は白血球の約60%で、異物を貪食する。ABO式は赤血球の型。浸透圧の維持はアルブミン、グロブリンは免疫物質。赤血球は骨髄で産生される。"}, {"id": 121, "s": "労働生理", "f": "免疫", "q": "免疫に関する次の記述のうち、誤っているものはどれか。", "c": ["抗体とは、体内に入ってきた抗原に対して体液性免疫において作られる免疫グロブリンと呼ばれる蛋白質で、抗原に特異的に結合する。", "抗原とは、免疫に関係する細胞によって異物として認識される物質をいう。", "アレルギーとは、抗原に対して免疫反応が過剰に起こり、身体に不利益な症状が現れることをいう。", "免疫不全とは、抗原に対して免疫反応が過剰に起こる状態をいう。", "免疫には、抗体による体液性免疫と、リンパ球などが直接病原体等を攻撃する細胞性免疫がある。"], "a": 4, "e": "免疫不全は、免疫の機能が失われたり低下したりした状態。感染症にかかりやすくなる。"}, {"id": 122, "s": "労働生理", "f": "消化・吸収", "q": "三大栄養素とその消化に関わる消化酵素の組合せとして、正しいものはどれか。", "c": ["炭水化物 ― トリプシン", "脂肪 ― リパーゼ", "蛋白質 ― リパーゼ", "蛋白質 ― アミラーゼ", "炭水化物 ― ペプシン"], "a": 2, "e": "炭水化物（糖質）＝アミラーゼ、蛋白質＝ペプシン・トリプシン、脂肪＝リパーゼ。"}, {"id": 123, "s": "労働生理", "f": "消化・吸収", "q": "消化及び吸収に関する次の記述のうち、誤っているものはどれか。", "c": ["胆汁は胆のうで生成され、肝臓で濃縮・貯蔵される。", "胆汁はアルカリ性で、消化酵素は含まないが、脂肪を乳化させて消化を助ける。", "蛋白質は、胃液中のペプシンや膵液中のトリプシンなどによって分解され、最終的にアミノ酸となって小腸から吸収される。", "脂肪は、膵液中のリパーゼによって脂肪酸とグリセリンに分解される。", "栄養素の吸収は、主に小腸の絨毛で行われる。"], "a": 1, "e": "胆汁は肝臓で生成され、胆のうで濃縮・貯蔵される。"}, {"id": 124, "s": "労働生理", "f": "肝臓", "q": "肝臓の機能として、誤っているものはどれか。", "c": ["インスリンの分泌", "グリコーゲンの合成及び分解", "アンモニアから尿素の合成", "胆汁の生成", "フィブリノーゲンなどの血液凝固物質の合成"], "a": 1, "e": "インスリンは膵臓のランゲルハンス島（β細胞）から分泌される。"}, {"id": 125, "s": "労働生理", "f": "腎臓・尿", "q": "腎臓及び尿に関する次の記述のうち、誤っているものはどれか。", "c": ["尿の約95%は水分で、残りの約5%が固形物である。", "腎小体とそれに続く1本の尿細管を合わせたものをネフロン（腎単位）という。", "腎小体では、糸球体から血球及び蛋白質以外の血漿成分がボウマン嚢に濾し出され、原尿が生成される。", "糸球体では、血液中のグルコースは濾過されず、そのまま血液中に残る。", "尿細管では、原尿に含まれる水分、電解質、糖などの成分が血液中に再吸収される。"], "a": 4, "e": "グルコースは糸球体で濾過され、尿細管でほぼすべて再吸収される。"}, {"id": 126, "s": "労働生理", "f": "腎臓・尿", "q": "尿及び腎機能の検査に関する次の記述のうち、正しいものはどれか。", "c": ["健康な人の尿は、通常、淡黄色の液体で、弱酸性である。", "尿蛋白が陽性であっても、腎臓や膀胱などの疾患を疑う必要はない。", "血液中の尿素窒素（BUN）の値が低くなる場合は、腎臓の機能の低下が考えられる。", "尿糖が陽性となるのは、糖尿病の場合に限られる。", "成人の1日の尿量は、通常約5Lである。"], "a": 1, "e": "腎機能が低下するとBUNは高くなる。尿糖は腎性糖尿でも陽性になる。1日の尿量は約1〜1.5L。"}, {"id": 127, "s": "労働生理", "f": "神経系", "q": "神経系に関する次の記述のうち、誤っているものはどれか。", "c": ["神経細胞（ニューロン）は、細胞体、樹状突起及び軸索から成る。", "脊髄では、中心部が白質であり、その外側は灰白質である。", "体性神経には、感覚器官からの情報を中枢に伝える感覚神経と、中枢からの命令を運動器官に伝える運動神経がある。", "大脳の皮質は、神経細胞の細胞体が集まった灰白質で、感覚、思考等の作用を支配する中枢として機能する。", "自律神経系は、交感神経系と副交感神経系から成る。"], "a": 2, "e": "脊髄は中心部が灰白質、外側が白質（大脳とは逆）。"}, {"id": 128, "s": "労働生理", "f": "神経系", "q": "自律神経系に関する次の記述のうち、正しいものはどれか。", "c": ["自律神経系の中枢は小脳にある。", "副交感神経が働くと、心拍数が増加し、気管支が拡張する。", "一般に、一つの器官は交感神経と副交感神経のどちらか一方のみに支配されている。", "交感神経が働くと、心拍数が減少し、消化管の運動が亢進する。", "交感神経は、身体の機能をより活動的に調節する働きがあり、心拍数を増加させ、消化管の運動を抑制する。"], "a": 5, "e": "副交感神経は心拍数減少・消化管運動亢進。自律神経の中枢は視床下部など。多くの器官は交感・副交感の二重支配を受ける。"}, {"id": 129, "s": "労働生理", "f": "感覚器", "q": "視覚に関する次の記述のうち、誤っているものはどれか。", "c": ["遠視は、眼軸が短すぎるために、平行光線が網膜の前方で像を結ぶものである。", "網膜には、明るい所で働き色を感じる錐状体と、暗い所で働き弱い光や明暗を感じる杆状体の2種類の視細胞がある。", "明るい所から急に暗い所に入ると、初めは見えにくいが徐々に見えるようになることを暗順応といい、明順応よりも時間がかかる。", "眼は、周りの明るさによって瞳孔の大きさが変化して眼に入る光量が調節され、暗い場合には瞳孔が広がる。", "近視は、眼軸が長すぎるために、平行光線が網膜の前方で像を結ぶものである。"], "a": 1, "e": "遠視は網膜の「後方」で像を結ぶ。"}, {"id": 130, "s": "労働生理", "f": "感覚器", "q": "耳に関する次の記述のうち、正しいものはどれか。", "c": ["耳は、聴覚と平衡感覚をつかさどる器官で、外耳、中耳、内耳の三つの部位に分けられる。", "騒音性難聴は、中耳の障害による伝音性難聴である。", "内耳の蝸牛は平衡感覚を、前庭と半規管は聴覚をつかさどる。", "半規管は体の傾きの方向や大きさを、前庭は体の回転の方向や速度を感じる。", "鼓室は耳管によって咽頭に通じており、その内圧は外気圧よりも常に高く保たれている。"], "a": 1, "e": "蝸牛＝聴覚、前庭＝傾き、半規管＝回転。鼓室の内圧は外気圧と等しく保たれる。騒音性難聴は内耳の感音性難聴。"}, {"id": 131, "s": "労働生理", "f": "感覚器", "q": "感覚に関する次の記述のうち、誤っているものはどれか。", "c": ["嗅覚は、わずかな匂いでも感じるほど鋭敏であるが、同一臭気に対しては疲労しやすい。", "温度感覚は、一般に、冷覚のほうが温覚よりも鋭敏である。", "深部感覚は、筋肉や腱にある受容器から得られる、身体各部の位置や運動などの感覚である。", "皮膚感覚には、触圧覚、痛覚、温度感覚などがあり、痛覚点の密度は他の感覚点に比べて高い。", "味覚と嗅覚は物理感覚、視覚と聴覚は化学感覚である。"], "a": 5, "e": "味覚と嗅覚は化学感覚、視覚と聴覚は物理感覚。"}, {"id": 132, "s": "労働生理", "f": "筋肉", "q": "筋肉に関する次の記述のうち、誤っているものはどれか。", "c": ["平滑筋は、主に内臓に存在するため内臓筋とも呼ばれ、意思によって動かすことができない不随意筋である。", "筋肉は、神経から送られてくる刺激によって収縮するが、神経に比べて疲労しやすい。", "強い力を必要とする運動を続けていても、個々の筋線維の太さは変わらないが、その数が増えることによって筋肉が太くなり筋力が増強する。", "筋肉の長さを変えずに外力に抵抗して筋力を発生させる収縮を、等尺性収縮という。", "横紋筋は骨格筋と心筋から成り、骨格筋は随意筋、心筋は不随意筋である。"], "a": 3, "e": "筋線維の数は変わらず、一本一本が太くなることで筋肉が太くなる（筋肥大）。"}, {"id": 133, "s": "労働生理", "f": "筋肉", "q": "筋肉に関する次の記述のうち、正しいものはどれか。", "c": ["筋肉自体が収縮して出す最大筋力は、筋肉の断面積に関係しない。", "刺激に対して意識とは無関係に起こる定型的な反応を反射といい、膝蓋腱反射などの伸張反射がある。", "荷物を持ち上げたり屈伸運動をするとき、関節運動に関与する筋肉には等尺性収縮が生じている。", "筋肉中のグリコーゲンは、酸素が十分に供給されると分解されて乳酸になる。", "人が直立しているとき、姿勢保持の筋肉には等張性収縮が生じている。"], "a": 2, "e": "乳酸ができるのは酸素が不足したとき。屈伸運動は等張性収縮、姿勢保持は等尺性収縮。最大筋力は筋肉の断面積に比例する。"}, {"id": 134, "s": "労働生理", "f": "体温調節", "q": "体温調節に関する次の記述のうち、誤っているものはどれか。", "c": ["体温調節のように、外部環境が変化しても身体内部の状態を一定に保つ仕組みを恒常性（ホメオスタシス）という。", "体温調節中枢は、間脳の視床下部にある。", "寒冷にさらされて体温が正常以下になると、皮膚の血管が収縮して血流量が減り、放熱が減少する。", "発汗のほかに、皮膚及び呼気から水分を蒸発させている現象を不感蒸泄という。", "暑熱な環境においては、内臓の血流量が増加し体内の代謝活動が亢進することにより、人体からの熱の放散が促進される。"], "a": 5, "e": "暑熱環境では皮膚の血流量が増え、代謝活動は抑制されて熱の放散が促進される。"}, {"id": 135, "s": "労働生理", "f": "内分泌", "q": "ホルモン、その内分泌器官及びその働きの組合せとして、誤っているものはどれか。", "c": ["パラソルモン ― 副甲状腺 ― 血中のカルシウム量の減少", "メラトニン ― 松果体 ― 睡眠の促進", "グルカゴン ― 膵臓 ― 血糖量の増加", "インスリン ― 膵臓 ― 血糖量の減少", "アドレナリン ― 副腎髄質 ― 血糖量の増加"], "a": 1, "e": "パラソルモンは血中のカルシウム量を「増加」させる。"}, {"id": 136, "s": "労働生理", "f": "内分泌", "q": "ホルモン、その内分泌器官及びその働きの組合せとして、正しいものはどれか。", "c": ["アルドステロン ― 副腎髄質 ― 体液中の塩類バランスの調節", "コルチゾール ― 副腎皮質 ― 血糖量の減少", "インスリン ― 副腎皮質 ― 血糖量の減少", "ガストリン ― 胃 ― 胃酸分泌の刺激", "セクレチン ― 膵臓 ― 胃酸分泌の促進"], "a": 4, "e": "コルチゾールは血糖量を増加させる。アルドステロンは副腎皮質。セクレチンは十二指腸から分泌され、消化液の分泌を促す。インスリンは膵臓。"}, {"id": 137, "s": "労働生理", "f": "代謝", "q": "代謝に関する次の記述のうち、誤っているものはどれか。", "c": ["エネルギー代謝率は、作業に要したエネルギー量が基礎代謝量の何倍に当たるかを示す数値である。", "体内に摂取された栄養素が、ATPのエネルギーを用いて生体に必要な物質に合成されることを同化という。", "細胞に取り入れられた体脂肪やグリコーゲンなどが分解されてエネルギーを発生し、ATPが生産されることを異化という。", "基礎代謝量は、覚醒、横臥、安静時の測定値で表され、生命維持に必要な最小限のエネルギー量である。", "エネルギー代謝率は、動的筋作業の強度だけでなく、精神的作業や静的筋作業の強度を表す指標としても有用である。"], "a": 5, "e": "エネルギー代謝率は動的筋作業の強度の指標で、精神的作業や静的筋作業には適用できない。"}, {"id": 138, "s": "労働生理", "f": "睡眠", "q": "睡眠に関する次の記述のうち、誤っているものはどれか。", "c": ["体内時計の周期は一般に約25時間であり、外界の24時間周期に同調して約1時間のずれが修正される。", "入眠直後にはノンレム睡眠が生じ、これが不十分なときには、日中に眠気を催しやすい。", "睡眠中は交感神経の働きが活発になり、体温や心拍数が上昇する。", "夜間に働いた後の昼間に睡眠する場合は、一般に、就寝から入眠までの時間が長くなり、睡眠時間が短縮し、睡眠の質も低下する。", "睡眠は、眼球が速く動くレム睡眠と、急速眼球運動を伴わないノンレム睡眠に分けられる。"], "a": 3, "e": "睡眠中は副交感神経が優位になり、体温や心拍数は低下する。"}, {"id": 139, "s": "労働生理", "f": "ストレス", "q": "ストレスに関する次の記述のうち、誤っているものはどれか。", "c": ["昇進、転勤、配置替えなどがストレスの原因となることがある。", "個人にとって適度なストレッサーは、身体的には活動の亢進を、心理的には意欲の向上や作業効率の向上などをもたらす。", "ストレスにより、高血圧症、狭心症、十二指腸潰瘍などの疾患が生じることがある。", "ストレスにより、副腎皮質ホルモンやカテコールアミンの分泌が亢進する。", "ストレスに伴う心身の反応には個人差がなく、同じストレッサーに対しては誰でも同程度の反応が生じる。"], "a": 5, "e": "ストレス反応には大きな個人差がある。"}];
const SUMMARY = {"労働衛生": [["★化学物質の状態", "ガス＝常温で気体（塩素、塩化ビニル、ホルムアルデヒド、アンモニア、二酸化硫黄、CO、硫化水素）／蒸気＝液体・固体が揮発（アセトン、トルエン、二硫化炭素、アクリロニトリル、硫酸ジメチル）／粉じん＝機械的に砕いた固体（ジクロロベンジジン、石綿）／ミスト＝液体微粒子（硫酸、硝酸、クロム酸）／ヒューム＝気化した金属が凝固（溶接ヒューム、酸化亜鉛）"], ["★化学物質と健康障害", "CO：無色無臭、Hb親和力は酸素の200倍以上、後遺症に健忘・パーキンソン症状／シアン化水素：細胞内の酸素利用阻害／硫化水素：意識消失・呼吸麻痺／塩素：肺水腫／二酸化窒素：慢性気管支炎・歯牙酸蝕症／弗化水素：骨硬化・斑状歯／ベンゼン：再生不良性貧血・白血病／塩化ビニル：肝血管肉腫／ベンジジン・β-ナフチルアミン：膀胱がん／石綿：肺がん・中皮腫"], ["★有機溶剤", "揮発性高く蒸気は空気より重い、脂溶性で皮膚吸収、中枢神経抑制。ノルマルヘキサン＝末梢神経障害、メタノール＝視神経障害、二硫化炭素＝精神障害・網膜細小動脈瘤、DMF＝肝障害。代謝物：キシレン→メチル馬尿酸、スチレン→マンデル酸、ノルマルヘキサン→2,5-ヘキサンジオン、トリクロロエチレン→トリクロロ酢酸、DMF→N-メチルホルムアミド。区分表示：第1種赤・第2種黄・第3種青"], ["金属", "鉛：貧血・伸筋麻痺・腹部疝痛（血中鉛、尿中デルタアミノレブリン酸）／金属水銀：手指振戦・精神障害／マンガン：パーキンソン様症状／カドミウム：肺気腫・腎障害／クロム：鼻中隔穿孔・肺がん／ヒ素：角化症・黒皮症・鼻中隔穿孔"], ["★じん肺", "線維増殖性変化、不可逆、ばく露中止後も進行。合併症：肺結核、続発性気管支炎、続発性気胸、原発性肺がん等。けい肺＝遊離けい酸"], ["★物理的因子", "騒音性難聴：感音性・4,000Hz付近から低下（c5dip）・治りにくい／振動：レイノー現象、冬に多い／電離放射線：確定的影響（しきい値あり：白内障・皮膚障害）、確率的影響（しきい値なし：がん・遺伝）／熱中症4分類／WBGT：屋内0.7湿球+0.3黒球、屋外0.7湿球+0.2黒球+0.1乾球／低体温症35℃以下／減圧症＝減圧時の窒素気泡／酸欠＝O₂ 18%未満"], ["★作業環境測定", "第一評価値＝高濃度側5%値、第二評価値＝算術平均推定値。第一評価値＜管理濃度→第1、第二評価値＞管理濃度→第3、その間→第2。B測定値＞管理濃度×1.5→第3"], ["★局所排気装置", "囲い式＞外付け式。フランジで効率UP。キャノピ型＝レシーバ式、ドラフトチェンバ＝囲い式、スロット型＝外付け式。ファンは空気清浄装置の後。曲がりは少なく、合流角45°以内"], ["★保護具", "防じん・防毒マスクはO₂ 18%未満で使用不可（送気マスク・空気呼吸器は可）。吸収缶：有機ガス黒、CO赤、アンモニア緑、硫化水素黄、シアン化水素青、ハロゲン灰/黒。ろ過材を圧縮空気で吹かない"], ["3管理・リスクアセスメント", "作業環境管理＝局排・代替／作業管理＝保護具・作業時間・姿勢／健康管理＝健診。低減措置の優先順位：①代替等 ②工学的対策 ③管理的対策 ④保護具"], ["★必要換気量", "必要換気量＝呼出CO₂量÷（室内基準0.1%−外気CO₂濃度）。呼気はCO₂約4%、O₂約16%。換気回数＝必要換気量÷気積"], ["温熱条件", "温熱4要素＝気温・湿度・気流・ふく射熱。実効温度はふく射熱を含まない（含むのは修正実効温度）。作業強度大→至適温度は低い"], ["★照明", "一般事務300lx以上・付随的事務150lx以上（2022改正）。全般照明は局部照明の1/10以上。光源と視線の角度30°以上。点検は6か月以内ごと"], ["★情報機器作業", "書類・キーボード上300lx以上目安、視距離40cm以上、画面上端は目の高さかやや下、一連続作業1時間以内・休止10〜15分・小休止1〜2回、健診は配置前＋1年以内ごと"], ["受動喫煙", "喫煙専用室：出入口の気流0.2m/秒以上、壁・天井で区画、屋外排気"], ["★腰痛予防", "男性は体重のおおむね40%以下、女性はその60%程度。健診は配置前＋6か月以内ごと"], ["★メンタルヘルス", "4つのケア：セルフケア／ライン／事業場内産業保健スタッフ等／事業場外資源。計画は衛生委員会で審議"], ["★一次救命処置", "呼吸確認10秒以内、死戦期呼吸は心停止扱い、圧迫は約5cm・100〜120回/分、30:2、電気ショック後は直ちに圧迫再開"], ["応急手当", "全血液量は体重の約1/13、1/3失うと危険。にじむ出血＝毛細血管性。複雑骨折＝開放骨折。水疱は破らない、痛み無し・白色＝Ⅲ度"], ["★食中毒", "感染型：サルモネラ、腸炎ビブリオ（熱に弱い）、カンピロバクター／毒素型：黄色ブドウ球菌（毒素は熱に強い）、ボツリヌス（嫌気性・神経毒）／O-157＝ベロ毒素／ノロ＝冬・次亜塩素酸"], ["脳・心臓疾患", "出血性（脳出血・くも膜下出血）と虚血性（脳血栓症・脳塞栓症）。狭心症は数分、心筋梗塞は30分以上"], ["★労働衛生統計", "疾病休業日数率＝休業延日数÷延所定労働日数×100。静態＝時点、動態＝期間。相関≠因果。レベルを低く→偽陽性↑偽陰性↓"], ["メタボ・感染症", "腹囲 男85cm・女90cm以上（内臓脂肪100cm²）＋3項目中2つ以上。不顕性感染・キャリア・日和見感染。インフルエンザは飛沫感染"]], "関係法令": [["★選任の数字", "衛生管理者：50〜200人1人／201〜500人2人／501〜1,000人3人／1,001〜2,000人4人／2,001〜3,000人5人／3,001人以上6人。選任は14日以内、遅滞なく報告。専任は1,000人超、又は500人超で有害業務30人以上。製造業など有害業務の多い業種は第一種が必要"], ["★産業医・衛生委員会", "産業医は50人以上で選任、1,000人以上（有害業務・深夜業500人以上）で専属、巡視は毎月1回（条件付きで2か月に1回）。法人代表者は産業医になれない。衛生委員会は毎月1回以上、委員の半数は労働者側推薦、記録3年"], ["★作業主任者", "免許：高圧室内、エックス線、ガンマ線透過写真撮影。技能講習：有機溶剤、特化物、鉛、酸欠、石綿など。粉じん作業は作業主任者不要（特別教育が必要）"], ["★作業環境測定の頻度", "有機・特化・粉じん・騒音・石綿は6か月以内ごと／鉛は1年以内ごと／暑熱・寒冷・多湿は半月以内ごと／放射線は1か月以内ごと／事務所の空調は2か月以内ごと／酸欠は作業開始前"], ["★記録の保存期間", "原則3年（作業環境測定・自主検査）、健康診断個人票5年、粉じん7年、電離放射線・特別管理物質30年、石綿40年"], ["特殊健康診断", "雇入れ時・配置替え時・6か月以内ごと。結果報告は規模に関係なく必要。歯科医師健診は塩酸・硝酸・硫酸等で6か月以内ごと"], ["酸欠・特別教育", "酸欠＝O₂ 18%未満、作業前に測定、純酸素で換気しない。特別教育が必要：酸欠、石綿、エックス線・ガンマ線撮影、特定粉じん。不要：有機溶剤、特化物"], ["労基法", "時間外2時間制限の有害業務（高熱・寒冷・放射線・粉じん・異常気圧・振動・重量物・騒音・有害物）。産前6週（多胎14週）は請求で休業、産後8週は就業不可（6週後は請求＋医師OKで可）。育児時間は1日2回各30分。年休は6か月・8割で10日、時季指定は年5日"], ["一般健康診断・面接指導", "雇入れ時健診は省略不可（3か月以内の健診書面で代替可）、報告不要。定期健診は1年以内ごと、50人以上で報告。長時間労働は月80時間超＋申出で面接指導、研究開発業務は月100時間超なら申出不要。ストレスチェックは50人以上で年1回、面接は申出があったとき"], ["事務所衛生基準規則", "気積10m³/人、窓は床面積の1/20以上、空調時はCO 10ppm以下・CO₂ 1,000ppm以下・18〜28℃・湿度40〜70%・気流0.5m/秒以下。燃焼器具は毎日点検、大掃除は6か月ごと、機械換気設備は2か月ごと点検。休養室は50人以上又は女性30人以上"], ["最近の法改正", "2024年4月：化学物質管理者・保護具着用管理責任者の選任、雇入れ時教育の省略規定廃止。2025年6月：熱中症対策の義務化（WBGT28℃又は31℃以上、連続1時間又は1日4時間超の作業）"]], "労働生理": [["★呼吸", "呼吸筋（肋間筋・横隔膜）で胸郭を動かす。外呼吸は肺胞、内呼吸は組織。呼吸中枢は延髄で、CO₂の増加で刺激される。呼吸数は1分16〜20回"], ["★心臓・血液", "洞結節で発生した刺激で拍動。肺動脈は静脈血、肺静脈は動脈血。血漿55%、赤血球の寿命120日、ヘマトクリットは男性が高い。凝固はフィブリノーゲンからフィブリンへ。好中球60%で貪食、Bリンパ球は抗体、Tリンパ球は細胞性免疫"], ["★消化・肝臓・腎臓", "アミラーゼ＝糖、ペプシン・トリプシン＝蛋白、リパーゼ＝脂肪。胆汁は肝臓で作られ、消化酵素を含まない。肝臓：グリコーゲン、尿素、凝固物質、胆汁。腎臓：糸球体→ボウマン嚢→尿細管で再吸収。BUN高値は腎機能低下"], ["★神経・感覚", "大脳は外側が灰白質、脊髄は中心が灰白質。交感神経は心拍↑・消化↓。錐状体は色、杆状体は明暗。近視は網膜の前、遠視は後ろに像。蝸牛＝聴覚、前庭＝傾き、半規管＝回転。冷覚は温覚より鋭敏、痛覚点が最多"], ["筋肉", "骨格筋は随意、心筋・平滑筋は不随意。姿勢保持は等尺性、屈伸運動は等張性。筋線維は数でなく太さが増す。酸素不足で乳酸"], ["体温・ホルモン・代謝・睡眠", "体温調節中枢は視床下部。暑いと皮膚の血流が増える。インスリンは血糖↓、グルカゴン・アドレナリン・コルチゾールは血糖↑、パラソルモンはCa↑。エネルギー代謝率は動的筋作業のみ。睡眠中は副交感神経が優位。体内時計は約25時間"]]};

let prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { prog = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(prog)); }catch(e){} }
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("totalN").textContent = DATA.length;

(function(){
  const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d = Math.round((new Date(2026,11,8) - t) / 86400000);
  $("#days").textContent = d > 0 ? d : (d === 0 ? "当日" : "終了");
})();

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function statOf(list){ let done=0, ok=0; list.forEach(q=>{ const p=prog[q.id]; if(p){ done++; if(p.r) ok++; } }); return {n:list.length, done, ok}; }
function bar(s){ const w = s.n ? s.ok/s.n*100 : 0, w2 = s.n ? (s.done-s.ok)/s.n*100 : 0; return `<div class="bar" aria-hidden="true"><i class="b-ok" style="width:${w}%"></i><i class="b-ng" style="width:${w2}%"></i></div>`; }
function setTab(t){ document.querySelectorAll(".tab").forEach(b=>{ if(b.dataset.tab===t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); }); window.scrollTo(0,0); }

/* ---------- home ---------- */
function home(){
  setTab("home");
  const all = statOf(DATA);
  let h = `<div><h2>分野別に解く</h2><p class="lead">選択肢をタップすると、正解・不正解にかかわらず解説が表示されます。成績はこの端末に保存されます。</p></div>
  <div class="card subj"><div class="subj-h"><h3>全体の進み具合</h3><span class="stat">${all.done}/${all.n}問 解答・正答 ${all.ok}</span></div>${bar(all)}
  <div class="row"><button class="btn" data-go="wrong-all" ${Object.values(prog).some(p=>!p.r)?"":"disabled"}>間違えた問題だけ（全科目）</button><button class="btn" data-go="reset">成績をリセット</button></div></div>`;
  SUBJECTS.forEach((s,si)=>{
    const list = DATA.filter(q=>q.s===s); const st = statOf(list);
    const fields = [...new Set(list.map(q=>q.f))];
    const [grp, sub] = s.split("（");
    h += `<div class="card subj"><div class="subj-h"><h3>${esc(grp)}</h3><span class="tag">${esc(sub.replace("）",""))}</span><span class="stat">${st.done}/${st.n}・正答${st.n?Math.round(st.ok/st.n*100):0}%</span></div>${bar(st)}
    <div class="row"><button class="btn primary" data-go="s:${si}:all">最初から</button><button class="btn" data-go="s:${si}:rand">ランダム</button><button class="btn" data-go="s:${si}:new" ${st.done<st.n?"":"disabled"}>未回答</button><button class="btn" data-go="s:${si}:wrong" ${list.some(q=>prog[q.id]&&!prog[q.id].r)?"":"disabled"}>間違えた問題</button></div>
    <details class="fields"><summary>分野を選んで解く（${fields.length}分野）</summary><div class="chips">${fields.map((f,fi)=>{ const fl=list.filter(q=>q.f===f), fs=statOf(fl); return `<button class="chip ${fs.done===fs.n?"done":""}" data-go="f:${si}:${fi}">${esc(f)}<span>${fs.ok}/${fs.n}</span></button>`; }).join("")}</div></details></div>`;
  });
  view.innerHTML = h;
  view.querySelectorAll("[data-go]").forEach(b=> b.addEventListener("click", ()=>{
    const g = b.dataset.go;
    if(g==="reset"){ if(b.dataset.confirm){ prog={}; save(); home(); } else { b.dataset.confirm="1"; b.textContent="もう一度押すとリセット"; } return; }
    if(g==="wrong-all") return start(DATA.filter(q=>prog[q.id]&&!prog[q.id].r), "間違えた問題（全科目）");
    const [k,si,mode] = g.split(":"); const s = SUBJECTS[+si]; let list = DATA.filter(q=>q.s===s);
    if(k==="f"){ const f=[...new Set(list.map(q=>q.f))][+mode]; return start(list.filter(q=>q.f===f), s+"・"+f); }
    if(mode==="rand") list = shuffle(list);
    if(mode==="new") list = list.filter(q=>!prog[q.id]);
    if(mode==="wrong") list = list.filter(q=>prog[q.id]&&!prog[q.id].r);
    start(list, s);
  }));
}

/* ---------- quiz ---------- */
let S = null;
function start(list, title, mock){ if(!list.length) return; S = {list, title, i:0, ans:{}, mock:!!mock}; setTab(mock?"mock":"home"); quiz(); }
function quiz(){
  const q = S.list[S.i]; const a = S.ans[q.id];
  let h = `<div class="qhead"><button class="btn" id="qBack">← ${S.mock?"中断":"一覧へ"}</button><span class="qpos">${S.i+1} / ${S.list.length}</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="qmeta"><span class="tag">${esc(q.s)}</span><span class="tag" style="background:var(--bg);color:var(--muted)">${esc(q.f)}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="choices">${q.c.map((c,ci)=>{ let cls=""; if(a!==undefined){ if(ci+1===q.a) cls="is-ok"; else if(ci+1===a) cls="is-ng"; } return `<button class="ch ${cls}" data-c="${ci+1}" ${a!==undefined?"disabled":""}><span class="no">${ci+1}</span><span class="tx">${esc(c)}</span></button>`; }).join("")}</div>`;
  if(a!==undefined){
    const ok = a===q.a;
    h += `<div class="verdict ${ok?"ok":"ng"}"><span class="sym">${ok?"○":"×"}</span>${ok?"正解":"不正解"}</div>
    <div class="exp"><p class="ans">正解は (${q.a}) ${esc(q.c[q.a-1])}</p><p>${esc(q.e)}</p></div>`;
  }
  h += `</div><div class="navq"><button class="btn" id="qPrev" ${S.i===0?"disabled":""}>← 前の問題</button><button class="btn primary" id="qNext">${S.i===S.list.length-1?"結果を見る":"次の問題 →"}</button></div>`;
  view.innerHTML = h; window.scrollTo(0,0);
  view.querySelectorAll(".ch").forEach(b=> b.addEventListener("click", ()=>{
    const c = +b.dataset.c; S.ans[q.id] = c;
    const p = prog[q.id] || {n:0,w:0}; p.n++; p.r = c===q.a ? 1 : 0; if(!p.r) p.w++; prog[q.id]=p; save();
    quiz(); const v = view.querySelector(".verdict"); if(v) v.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  }));
  $("#qBack").onclick = ()=> S.mock ? mockStart() : home();
  $("#qPrev").onclick = ()=>{ S.i--; quiz(); };
  $("#qNext").onclick = ()=>{ if(S.i<S.list.length-1){ S.i++; quiz(); } else result(); };
}
function result(){
  const total = S.list.length, done = S.list.filter(q=>S.ans[q.id]!==undefined).length, ok = S.list.filter(q=>S.ans[q.id]===q.a).length;
  let h = `<div><h2>${S.mock?"模擬試験の結果":"結果"}</h2><p class="lead">${esc(S.title)}</p></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="score">${ok}<small> / ${total}問正解</small></div>${bar({n:total,done,ok})}`;
  if(S.mock){
    let pass = ok/total >= 0.6;
    h += `<table class="res"><thead><tr><th>科目</th><th style="text-align:right">得点</th><th></th></tr></thead><tbody>`;
    SUBJECTS.forEach(s=>{ const l=S.list.filter(q=>q.s===s), o=l.filter(q=>S.ans[q.id]===q.a).length, r=l.length?o/l.length:0; if(r<0.4) pass=false;
      h += `<tr><td>${esc(s)}</td><td class="n">${o}/${l.length}（${Math.round(r*100)}%）</td><td><span class="pill ${r>=0.4?"ok":"ng"}">${r>=0.4?"40%以上":"足切り"}</span></td></tr>`; });
    h += `</tbody></table><p style="margin:0"><span class="pill ${pass?"ok":"ng"}" style="font-size:15px">${pass?"合格ライン到達":"合格ライン未達"}</span> <span class="note">科目ごとに40%以上、かつ合計60%以上で合格</span></p>`;
  }
  const wrong = S.list.filter(q=>S.ans[q.id]!==undefined && S.ans[q.id]!==q.a);
  h += `<div class="row"><button class="btn primary" id="rWrong" ${wrong.length?"":"disabled"}>間違えた${wrong.length}問を解き直す</button><button class="btn" id="rHome">${S.mock?"模擬試験トップへ":"一覧へ戻る"}</button></div></div>`;
  view.innerHTML = h; window.scrollTo(0,0);
  $("#rWrong").onclick = ()=> start(wrong, "解き直し："+S.title);
  $("#rHome").onclick = ()=> S.mock ? mockStart() : home();
}

/* ---------- mock ---------- */
function mockStart(){
  setTab("mock");
  view.innerHTML = `<div><h2>模擬試験（44問）</h2><p class="lead">本試験と同じ科目構成で、各科目からランダムに出題します。解答ごとに解説が出て、最後に科目別の合否判定を表示します。</p></div>
  <div class="card"><table class="res"><thead><tr><th>科目</th><th style="text-align:right">出題数</th></tr></thead><tbody>${SUBJECTS.map(s=>`<tr><td>${esc(s)}</td><td class="n">${MOCK[s]}問</td></tr>`).join("")}<tr><td><b>合計</b></td><td class="n"><b>44問</b></td></tr></tbody></table>
  <p class="note">本試験は3時間（13:30〜16:30）。合格基準は科目ごとに40%以上、かつ合計60%以上です。</p>
  <button class="btn primary" id="mGo" style="width:100%">模擬試験を始める</button></div>`;
  $("#mGo").onclick = ()=>{ let l=[]; SUBJECTS.forEach(s=>{ l = l.concat(shuffle(DATA.filter(q=>q.s===s)).slice(0,MOCK[s])); }); start(l, "模擬試験 "+new Date().toLocaleDateString("ja-JP"), true); };
}

/* ---------- summary ---------- */
function sum(){
  setTab("sum");
  let h = `<div><h2>要点まとめ</h2><p class="lead">★はほぼ毎回出題されるテーマです。</p></div>`;
  Object.keys(SUMMARY).forEach((k,i)=>{
    h += `<details class="sum" ${i===0?"open":""}><summary>${esc(k)}</summary><div class="pt">${SUMMARY[k].map(([t,b])=>`<div><b>${esc(t)}</b><p>${esc(b)}</p></div>`).join("")}</div></details>`;
  });
  view.innerHTML = h;
}

/* ---------- links ---------- */
function links(){
  setTab("links");
  view.innerHTML = `<div><h2>本試験の公表問題</h2><p class="lead">本試験の問題は著作物のため、このアプリには収録していません。安全衛生技術試験協会が年2回（4月・10月）、直近の1回分を無料で公開しています。仕上げに解いてください。</p></div>
  <div class="card links">
    <a href="https://www.exam.or.jp/" target="_blank" rel="noopener">安全衛生技術試験協会（公式サイト）<span>トップページ →「公表試験問題」から最新分を確認できます</span></a>
    <a href="https://www.exam.or.jp/wp-content/uploads/2025/10/LC20252114.pdf" target="_blank" rel="noopener">第一種衛生管理者 公表問題（2025年10月掲載分・PDF）<span>exam.or.jp</span></a>
    <a href="https://exam.or.jp/wp-content/uploads/2024/08/LC20241114.pdf" target="_blank" rel="noopener">第一種衛生管理者 公表問題（2024年掲載分・PDF）<span>exam.or.jp</span></a>
    <a href="https://www.exam.or.jp/lc_r052/LC20232114.pdf" target="_blank" rel="noopener">第一種衛生管理者 公表問題（令和5年後期分・PDF）<span>exam.or.jp</span></a>
  </div>
  <p class="note">公表問題のPDFには正答だけが載っていて、解説はありません。間違えた論点は、このアプリの分野別問題と要点まとめで確認してください。リンク先のPDFは協会側の掲載替えで開けなくなることがあります。その場合は公式サイトのトップから探してください。</p>`;
}

document.querySelectorAll(".tab").forEach(b=> b.addEventListener("click", ()=>{ const t=b.dataset.tab; ({home, mock:mockStart, sum, links})[t](); }));
home();
</script>
